<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LEGACY — THE WAVE LIST</title>
    <link rel="icon" type="image/png" href="logo.ico">

    <style>
        :root {
            --accent: #47e5bc;
            --gold: #ffcf4b;
            --bg-dark: #0b0c10;
            --card-bg: rgba(18, 22, 31, 0.88);
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) #0b0c10;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg-dark);
            font-family:
                'Inter',
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
            color: #fff;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: relative;
            z-index: 100;

            width: 100%;
            min-height: 64px;

            padding: 14px 32px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(16px);

            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-logo:hover {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .nav-link {
            color: #aaa;
            text-decoration: none;

            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            padding: 6px 12px;
            border-radius: 6px;

            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* =========================
           MAIN PAGE
        ========================= */

        .page {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 1700px;

            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        /* =========================
           HEADER
        ========================= */

        .hero {
            position: relative;

            padding: 34px 38px;
            margin-bottom: 24px;

            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;

            backdrop-filter: blur(18px);

            overflow: hidden;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.45);
        }

        .hero::before {
            content: "";

            position: absolute;
            top: -120px;
            right: -80px;

            width: 350px;
            height: 350px;

            background: radial-gradient(
                circle,
                rgba(71, 229, 188, 0.16),
                transparent 70%
            );

            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            color: var(--accent);

            font-size: 0.78rem;
            font-weight: 900;

            letter-spacing: 2px;
            text-transform: uppercase;

            margin-bottom: 8px;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 4.5rem);

            line-height: 1;
            font-weight: 950;

            letter-spacing: -2px;

            margin-bottom: 14px;
        }

        .hero-description {
            color: #aaa;

            max-width: 720px;

            font-size: 1rem;
            line-height: 1.6;
        }

        .hero-stats {
            display: flex;
            flex-wrap: wrap;

            gap: 10px;

            margin-top: 24px;
        }

        .hero-stat {
            background: rgba(0, 0, 0, 0.35);

            border: 1px solid var(--border);
            border-radius: 9px;

            padding: 9px 14px;

            font-size: 0.8rem;
            font-weight: 800;

            color: #aaa;
        }

        .hero-stat strong {
            color: #fff;
        }

        /* =========================
           SEARCH / CONTROLS
        ========================= */

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;

            position: relative;
        }

        .search-box input {
            width: 100%;

            padding: 14px 18px;

            background: rgba(18, 22, 31, 0.88);

            border: 1px solid var(--border);
            border-radius: 11px;

            color: #fff;

            font-size: 0.95rem;

            outline: none;

            backdrop-filter: blur(12px);

            transition: border-color 0.2s ease,
                        background 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.06);
        }

        .search-box input::placeholder {
            color: #666;
        }

        .count {
            flex-shrink: 0;

            color: #888;

            font-size: 0.82rem;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* =========================
           LEGACY GRID
        ========================= */

        #legacy-list {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(330px, 1fr));

            gap: 16px;
        }

        /* =========================
           LEVEL CARD
        ========================= */

        .legacy-card {
            position: relative;

            min-height: 150px;

            background: rgba(18, 22, 31, 0.88);

            border: 1px solid var(--border);
            border-radius: 15px;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .legacy-card:hover {
            transform: translateY(-4px);

            border-color: var(--border-hover);

            box-shadow:
                0 14px 32px rgba(0, 0, 0, 0.6);
        }

        .card-background {
            position: absolute;
            inset: 0;

            background-size: cover;
            background-position: center;

            opacity: 0.45;

            transition:
                opacity 0.3s ease,
                transform 0.35s ease;
        }

        .legacy-card:hover .card-background {
            opacity: 0.7;
            transform: scale(1.05);
        }

        .card-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(11, 12, 16, 0.97) 0%,
                    rgba(11, 12, 16, 0.82) 55%,
                    rgba(11, 12, 16, 0.94) 100%
                );
        }

        .card-content {
            position: relative;
            z-index: 2;

            min-height: 150px;

            padding: 18px;

            display: flex;
            align-items: center;

            gap: 16px;
        }

        /* =========================
           LEGACY BADGE
        ========================= */

        .legacy-badge {
            flex-shrink: 0;

            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.48);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: #888;

            font-size: 0.68rem;
            font-weight: 900;

            letter-spacing: 1px;

            text-align: center;
        }

        .legacy-badge span {
            display: block;
        }

        /* =========================
           CARD INFO
        ========================= */

        .card-info {
            min-width: 0;
            flex: 1;
        }

        .card-title {
            font-size: 1.12rem;

            font-weight: 900;

            line-height: 1.25;

            color: #fff;

            margin-bottom: 7px;

            overflow: hidden;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-meta {
            display: flex;

            flex-direction: column;

            gap: 3px;

            color: #999;

            font-size: 0.76rem;
            font-weight: 650;
        }

        .card-meta strong {
            color: #ccc;
        }

        .legacy-label {
            display: inline-block;

            margin-top: 9px;

            color: #777;

            font-size: 0.68rem;
            font-weight: 900;

            letter-spacing: 1.2px;

            text-transform: uppercase;
        }

        /* =========================
           EMPTY / LOADING
        ========================= */

        .message {
            grid-column: 1 / -1;

            padding: 60px 20px;

            text-align: center;

            color: #666;

            background: rgba(18, 22, 31, 0.65);

            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .message-title {
            color: #aaa;

            font-size: 1.1rem;
            font-weight: 800;

            margin-bottom: 6px;
        }

        /* =========================
           FLOATING BUTTONS
        ========================= */

        .floating-btn {
            position: fixed;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.6);

            z-index: 9999;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background-color 0.2s ease;

            text-decoration: none;
        }

        .rules-btn {
            bottom: 20px;
            right: 80px;

            background: rgba(30, 34, 45, 0.9);

            border: 1px solid var(--border);
        }

        .rules-btn:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        .discord-btn {
            bottom: 20px;
            right: 20px;

            background: #5865F2;

            border: none;
        }

        .discord-btn:hover {
            transform: scale(1.1);
            background-color: #4752C4;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            .page {
                padding: 28px 18px 70px;
            }

            #legacy-list {
                grid-template-columns:
                    repeat(auto-fill, minmax(280px, 1fr));
            }

            .hero {
                padding: 28px;
            }
        }

        /* =========================
           PHONE
        ========================= */

        @media (max-width: 600px) {

            nav {
                min-height: 60px;

                padding: 12px 14px;

                gap: 10px;
            }

            .nav-logo {
                font-size: 0.95rem;
                letter-spacing: 1.2px;

                white-space: nowrap;
            }

            .nav-links {
                gap: 3px;
            }

            .nav-link {
                font-size: 0.62rem;
                letter-spacing: 0.5px;

                padding: 5px 4px;
            }

            .page {
                padding: 14px 10px 65px;
            }

            .hero {
                padding: 22px 18px;

                border-radius: 14px;

                margin-bottom: 12px;
            }

            .hero h1 {
                font-size: 2.3rem;
                letter-spacing: -1px;
            }

            .hero-description {
                font-size: 0.84rem;
                line-height: 1.5;
            }

            .hero-stats {
                margin-top: 18px;
            }

            .hero-stat {
                font-size: 0.7rem;
                padding: 7px 10px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;

                gap: 8px;

                margin-bottom: 12px;
            }

            .count {
                text-align: right;

                font-size: 0.7rem;
            }

            #legacy-list {
                grid-template-columns: 1fr;

                gap: 9px;
            }

            .legacy-card {
                min-height: 112px;

                border-radius: 11px;
            }

            .card-content {
                min-height: 112px;

                padding: 11px;

                gap: 11px;
            }

            .legacy-badge {
                width: 58px;
                height: 58px;

                border-radius: 9px;

                font-size: 0.55rem;
            }

            .card-title {
                font-size: 0.94rem;

                margin-bottom: 5px;
            }

            .card-meta {
                font-size: 0.67rem;
            }

            .legacy-label {
                margin-top: 6px;

                font-size: 0.59rem;
            }

            .floating-btn {
                width: 42px;
                height: 42px;
            }

            .rules-btn {
                bottom: 12px;
                right: 64px;
            }

            .discord-btn {
                bottom: 12px;
                right: 12px;
            }
        }

        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .nav-logo {
                font-size: 0.8rem;
            }

            .nav-link {
                font-size: 0.55rem;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .legacy-badge {
                width: 50px;
                height: 50px;

                font-size: 0.5rem;
            }

            .card-title {
                font-size: 0.88rem;
            }
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <div
            class="nav-logo"
            onclick="window.location.href='index.html'">

            THE WAVE LIST

        </div>

        <div class="nav-links">

            <a href="submit.html" class="nav-link">
                SUBMIT
            </a>

            <a href="roulette.html" class="nav-link">
                ROULETTE
            </a>

            <a href="leaderboard.html" class="nav-link">
                LEADERBOARD
            </a>

        </div>

    </nav>


    <!-- =========================
         PAGE
    ========================= -->

    <main class="page">

        <section class="hero">

            <div class="hero-content">

                <div class="eyebrow">
                    THE WAVE LIST
                </div>

                <h1>
                    LEGACY
                </h1>

                <p class="hero-description">
                    Levels that have fallen outside the main and
                    extended list. These levels are preserved as
                    part of the history of The Wave List.
                </p>

                <div class="hero-stats">

                    <div class="hero-stat">
                        <strong id="legacy-count">—</strong>
                        LEGACY LEVELS
                    </div>

                    <div class="hero-stat">
                        <strong>151+</strong>
                        FORMER POSITION
                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             CONTROLS
        ========================= -->

        <div class="controls">

            <div class="search-box">

                <input
                    type="text"
                    id="legacy-search"
                    placeholder="Search legacy levels..."
                    autocomplete="off"
                >

            </div>

            <div
                class="count"
                id="result-count">

                Loading...

            </div>

        </div>


        <!-- =========================
             LEGACY LEVELS
        ========================= -->

        <div id="legacy-list">

            <div class="message">

                <div class="message-title">
                    Loading legacy levels...
                </div>

                <div>
                    Please wait.
                </div>

            </div>

        </div>

    </main>


    <!-- =========================
         FLOATING BUTTONS
    ========================= -->

    <a
        href="rules.html"
        class="floating-btn rules-btn"
        title="Rules">

        <span
            style="
                font-size:1.3rem;
                user-select:none;
            ">

            📜

        </span>

    </a>


    <a
        href="https://discord.com/invite/7SjKU8vy8x"
        target="_blank"
        class="floating-btn discord-btn"
        title="Discord Community">

        <img
            src="discord.png"
            alt="Discord"
            style="
                width:24px;
                height:24px;
                object-fit:contain;
            "
            onerror="
                this.style.display='none';
                this.parentElement.innerHTML='💬';
            "
        >

    </a>


    <script>

        /* =========================
           BACKGROUND PARTICLES
        ========================= */

        const canvas =
            document.getElementById('bg-canvas');

        const ctx =
            canvas.getContext('2d');

        let particles = [];


        function initCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

            particles = [];

            for (let i = 0; i < 65; i++) {

                particles.push({

                    x:
                        Math.random() *
                        canvas.width,

                    y:
                        Math.random() *
                        canvas.height,

                    radius:
                        Math.random() * 2 + 0.5,

                    speed:
                        Math.random() * 0.3 + 0.1

                });

            }

        }


        function animateCanvas() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            particles.forEach(p => {

                ctx.fillStyle =
                    "rgba(71, 229, 188, 0.2)";

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                p.y -= p.speed;


                if (p.y < 0) {
                    p.y = canvas.height;
                }

            });


            requestAnimationFrame(
                animateCanvas
            );

        }


        window.addEventListener(
            'resize',
            initCanvas
        );


        initCanvas();
        animateCanvas();


        /* =========================
           DATA
        ========================= */

        let allLevels = [];
        let legacyLevels = [];


        /* =========================
           INITIALIZE
        ========================= */

        async function init() {

            try {

                const response =
                    await fetch(
                        `levels.json?v=${new Date().getTime()}`
                    );


                if (!response.ok) {
                    throw new Error(
                        "Could not load levels.json"
                    );
                }


                allLevels =
                    await response.json();


                /*
                 * Sort exactly the same way as index.html:
                 * highest points first.
                 */

                allLevels.sort(
                    (a, b) =>
                        b.points - a.points
                );


                /*
                 * Everything after position 150
                 * is considered Legacy.
                 */

                legacyLevels =
                    allLevels.filter(
                        (level, index) =>
                            index >= 150
                    );


                document.getElementById(
                    'legacy-count'
                ).innerText =
                    legacyLevels.length;


                renderLegacy(
                    legacyLevels
                );


            } catch (error) {

                console.error(
                    "Error loading legacy list:",
                    error
                );


                document.getElementById(
                    'legacy-list'
                ).innerHTML = `

                    <div class="message">

                        <div class="message-title">
                            Error loading legacy levels
                        </div>

                        <div>
                            Make sure levels.json exists
                            in the same folder as legacy.html.
                        </div>

                    </div>

                `;


                document.getElementById(
                    'result-count'
                ).innerText =
                    "ERROR";

            }

        }


        /* =========================
           RENDER LEGACY LEVELS
        ========================= */

        function renderLegacy(
            levels
        ) {

            const container =
                document.getElementById(
                    'legacy-list'
                );


            container.innerHTML = "";


            document.getElementById(
                'result-count'
            ).innerText =
                `${levels.length} LEVEL${levels.length === 1 ? '' : 'S'}`;


            if (levels.length === 0) {

                container.innerHTML = `

                    <div class="message">

                        <div class="message-title">
                            No legacy levels found
                        </div>

                        <div>
                            Try another search.
                        </div>

                    </div>

                `;

                return;

            }


            levels.forEach(level => {

                /*
                 * Find the real position in the
                 * complete list.
                 */

                const realRank =
                    allLevels.indexOf(level) + 1;


                const thumbnail =
                    level.thumbnail ||
                    "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";


                const creator =
                    level.creator ||
                    "Unknown";


                const verifier =
                    level.verifier ||
                    "Unknown";


                const card =
                    document.createElement('div');


                card.className =
                    "legacy-card";


                card.innerHTML = `

                    <div
                        class="card-background"
                        style="
                            background-image:
                            url('${thumbnail}');
                        ">
                    </div>


                    <div class="card-overlay"></div>


                    <div class="card-content">


                        <div class="legacy-badge">

                            <span>
                                LEGACY
                            </span>

                        </div>


                        <div class="card-info">


                            <div class="card-title">

                                ${escapeHTML(
                                    level.name ||
                                    "Unnamed Level"
                                )}

                            </div>


                            <div class="card-meta">

                                <div>
                                    Creator:
                                    <strong>
                                        ${escapeHTML(
                                            creator
                                        )}
                                    </strong>
                                </div>

                                <div>
                                    Verifier:
                                    <strong>
                                        ${escapeHTML(
                                            verifier
                                        )}
                                    </strong>
                                </div>

                            </div>


                            <div class="legacy-label">

                                Formerly #${realRank}

                            </div>


                        </div>


                    </div>

                `;


                /*
                 * Clicking a card sends the user
                 * back to index.html and stores
                 * which level should be displayed.
                 *
                 * The index page can use this later
                 * if you want direct level linking.
                 */

                card.onclick = () => {

                    window.location.href =
                        `index.html?level=${encodeURIComponent(
                            level.name
                        )}`;

                };


                container.appendChild(card);

            });

        }


        /* =========================
           SEARCH
        ========================= */

        document
            .getElementById('legacy-search')
            .addEventListener(
                'input',
                function () {

                    const query =
                        this.value
                            .toLowerCase()
                            .trim();


                    const filtered =
                        legacyLevels.filter(
                            level =>
                                (level.name || "")
                                    .toLowerCase()
                                    .includes(query)
                        );


                    renderLegacy(
                        filtered
                    );

                }
            );


        /* =========================
           HTML ESCAPING
        ========================= */

        function escapeHTML(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           START
        ========================= */

        init();

    </script>

</body>
</html>
