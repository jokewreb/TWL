<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles" class="particles-container"></div>

    <nav>
        <div class="logo">WAVE LIST</div>
        <div class="nav-links">
            <button class="btn-leaderboard" onclick="toggleLeaderboard()">LEADERBOARD</button>
        </div>
    </nav>

    <div class="main-container">
        <aside class="sidebar" id="sidebar-list">
            <div style="padding: 20px;">Loading Levels...</div>
        </aside>

        <main class="content">
            <div class="level-card">
                <div class="video-container">
                    <div id="no-video" class="no-video-overlay" style="display:none;">No Video Available</div>
                    <iframe id="main-video" src="" allowfullscreen></iframe>
                </div>
                
                <div class="level-header">
                    <h1 id="level-name" style="margin-top: 0; font-weight: 900; letter-spacing: 1px;">Select a Level</h1>
                    <div id="level-id-badge" style="color: #bbb; font-weight: bold;">ID: -</div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="label">CREATOR</span>
                        <div id="stat-creator" class="value">-</div>
                    </div>
                    <div class="stat-box">
                        <span class="label">VERIFIER</span>
                        <div id="stat-verifier" class="value">-</div>
                    </div>
                    <div class="stat-box">
                        <span class="label">POINTS</span>
                        <div id="stat-points" class="value" style="color: #00e5ff;">-</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="leaderboard-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleLeaderboard()">✕</button>
            <h2 style="margin-top: 0; color: #00e5ff; font-weight: 900;">Top Players</h2>
            <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 20px;">Ranked by points of levels verified.</p>
            <div id="leaderboard-data"></div>
        </div>
    </div>

    <script>
        // 1. Particle Generator
        function spawnParticles() {
            const container = document.getElementById('particles');
            const colors = ['rgba(0, 229, 255, 0.2)', 'rgba(183, 0, 255, 0.2)', 'rgba(255, 0, 85, 0.2)'];
            for(let i = 0; i < 40; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.width = Math.random() * 15 + 5 + 'px';
                p.style.height = p.style.width;
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = Math.random() * 15 + 10 + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(p);
            }
        }
        spawnParticles();

        // 2. List & Data Logic
        let globalLevels = [];

        async function initList() {
            try {
                const response = await fetch('./levels.json');
                globalLevels = await response.json();
                
                // Sort by points highest to lowest
                globalLevels.sort((a, b) => b.points - a.points);

                const sidebar = document.getElementById('sidebar-list');
                sidebar.innerHTML = ''; 

                globalLevels.forEach((lvl, index) => {
                    const rank = index + 1;
                    const item = document.createElement('div');
                    
                    let rankClass = "rank-standard";
                    if(rank === 1) rankClass = "rank-gold";
                    if(rank === 2) rankClass = "rank-silver";
                    if(rank === 3) rankClass = "rank-bronze";

                    item.className = `list-item ${rankClass}`;
                    
                    // Bulletproof Image Logic
                    let thumb = "https://via.placeholder.com/120x68/1a1d24/ffffff?text=No+Video";
                    if(lvl.video && lvl.video.includes('medal.tv')) {
                        thumb = "https://cdn.medal.tv/assets/img/medal-logo.png";
                    } else if (lvl.video && lvl.video !== "") {
                        thumb = `https://img.youtube.com/vi/${lvl.video}/mqdefault.jpg`;
                    }

                    item.innerHTML = `
                        <div class="rank-number">#${rank}</div>
                        <img src="${thumb}" class="list-thumb" onerror="this.src='https://via.placeholder.com/120x68/1a1d24/333?text=Error'">
                        <div style="display: flex; flex-direction: column;">
                            <div class="list-title">${lvl.name}</div>
                            <div style="color: #aaa; font-size: 0.8rem; margin-top: 4px;"><b>${lvl.points}</b> PTS</div>
                        </div>
                    `;
                    
                    item.onclick = () => updateDisplay(lvl, rank);
                    sidebar.appendChild(item);
                });

                updateDisplay(globalLevels[0], 1);
                buildLeaderboard();
            } catch (error) {
                document.getElementById('sidebar-list').innerHTML = `<div style="padding: 20px; color: red;">Error loading levels.json</div>`;
            }
        }

        function updateDisplay(lvl, rank) {
            document.getElementById('level-name').innerText = `#${rank} ${lvl.name}`;
            document.getElementById('stat-creator').innerText = lvl.creator;
            document.getElementById('stat-verifier').innerText = lvl.verifier;
            document.getElementById('stat-points').innerText = lvl.points;
            document.getElementById('level-id-badge').innerText = `ID: ${lvl.id}`;

            const videoIframe = document.getElementById('main-video');
            const noVideo = document.getElementById('no-video');

            if (!lvl.video || lvl.video === "") {
                videoIframe.src = "";
                videoIframe.style.display = "none";
                noVideo.style.display = "flex";
            } else {
                videoIframe.style.display = "block";
                noVideo.style.display = "none";
                
                if(lvl.video.includes('medal.tv')) {
                    const clipId = lvl.video.split('/clips/')[1]?.split('?')[0];
                    videoIframe.src = `https://medal.tv/clip/${clipId}`;
                } else {
                    videoIframe.src = `https://www.youtube.com/embed/${lvl.video}`;
                }
            }
        }

        // 3. Leaderboard Generator
        function buildLeaderboard() {
            const players = {};
            globalLevels.forEach(lvl => {
                if(!players[lvl.verifier]) players[lvl.verifier] = 0;
                players[lvl.verifier] += lvl.points;
            });

            const sortedPlayers = Object.entries(players).sort((a, b) => b[1] - a[1]);
            const lbContainer = document.getElementById('leaderboard-data');
            lbContainer.innerHTML = '';
            
            sortedPlayers.forEach(([name, points], index) => {
                lbContainer.innerHTML += `
                    <div class="lb-player">
                        <span><span style="color:#555;">#${index + 1}</span> &nbsp; ${name}</span>
                        <span>${points} PTS</span>
                    </div>
                `;
            });
        }

        function toggleLeaderboard() {
            const modal = document.getElementById('leaderboard-modal');
            modal.classList.toggle('active');
        }

        initList();
    </script>
</body>
</html>
