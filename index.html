<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WAVE LIST</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100vh;
            background-color: #0b0c10;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Particle Canvas */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Header Navigation */
        nav {
            position: relative;
            z-index: 10;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-logo:hover {
            color: var(--accent, #47e5bc);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-link {
            color: #aaa;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .nav-link:hover {
            color: var(--accent, #47e5bc);
            transform: translateY(-1px);
        }

        /* Layout Structure */
        .main-layout {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 30px;
            padding: 25px 40px 50px 40px;
            max-width: 1920px;
            margin: 0 auto;
            width: 100%;
            align-items: flex-start;
        }

        /* Sidebar Column */
        .sidebar-container {
            width: 380px;
            min-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 25px;
            max-height: calc(100vh - 50px);
        }

        .search-wrapper {
            background: rgba(20, 22, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #level-search {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.25 ease;
            box-sizing: border-box;
        }

        #level-search:focus {
            border-color: var(--accent, #47e5bc);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(71, 229, 188, 0.2);
        }

        .sidebar {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 6px;
            background: rgba(20, 22, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        /* Custom Scrollbars */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--accent, #47e5bc);
        }

        /* Sidebar Item Card */
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.09);
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .list-item.active {
            background: rgba(71, 229, 188, 0.12);
            border-color: var(--accent, #47e5bc);
        }

        .thumb-mini {
            width: 80px;
            height: 45px;
            object-fit: cover;
            flex-shrink: 0;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .rank {
            font-weight: 800;
            font-size: 0.95rem;
            min-width: 38px;
            flex-shrink: 0;
            text-align: center;
        }

        /* Main Content View */
        .content {
            flex: 1;
            min-width: 0;
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .glass-card {
            background: rgba(20, 22, 30, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
        }

        /* Video Showcase */
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .main-title-text {
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -0.5px;
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Stats Section */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.2s ease;
        }

        .stat-card:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .stat-card div:last-child {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Victors Container */
        .victors-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e0e0e0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .tag:hover {
            background: var(--accent, #47e5bc);
            color: #0b0c10;
            border-color: var(--accent, #47e5bc);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(71, 229, 188, 0.3);
        }

        .player-link {
            color: inherit;
            text-decoration: none;
        }

        .player-link:hover {
            color: var(--accent, #47e5bc);
        }

        /* Tier Legend Column */
        #tier-legend-container {
            width: 320px;
            min-width: 320px;
            background: rgba(20, 22, 30, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 26px;
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            position: sticky;
            top: 25px;
        }

        /* Floating Action Buttons */
        .floating-btn {
            position: fixed;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            z-index: 9999;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
            text-decoration: none;
        }

        .rules-btn {
            bottom: 25px;
            right: 90px;
            background: rgba(30, 34, 45, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .rules-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent, #47e5bc);
            background: rgba(40, 45, 60, 0.95);
        }

        .discord-btn {
            bottom: 25px;
            right: 25px;
            background: #5865F2;
            border: none;
        }

        .discord-btn:hover {
            transform: scale(1.1);
            background-color: #4752C4;
        }

        @media (max-width: 1400px) {
            .content {
                flex-direction: column;
            }
            #tier-legend-container {
                width: 100%;
                min-width: 100%;
                position: static;
            }
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar-container {
                width: 100%;
                min-width: 100%;
                position: static;
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <nav>
        <div class="nav-logo" onclick="window.location.href='index.html'">THE WAVE LIST</div>
        <div class="nav-links">
            <a href="submit.html" class="nav-link">SUBMIT</a>
            <a href="roulette.html" class="nav-link">ROULETTE</a>
            <a href="leaderboard.html" class="nav-link">LEADERBOARD</a>
        </div>
    </nav>

    <div class="main-layout">
        <!-- Sidebar Navigation -->
        <div class="sidebar-container">
            <div class="search-wrapper">
                <input type="text" id="level-search" placeholder="Search levels..." oninput="filterLevels()">
            </div>
            <div class="sidebar" id="sidebar"></div>
        </div>

        <!-- Main Display Panel -->
        <div class="content">
            <div class="glass-card">
                <div class="video-box">
                    <iframe id="main-vid" src="" frameborder="0" allowfullscreen></iframe>
                </div>
                
                <h1 id="main-title" class="main-title-text">Loading...</h1>
                
                <div class="info-grid">
                    <div class="stat-card">
                        <div class="stat-label">Creator</div>
                        <div id="s-creator">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Verifier</div>
                        <div id="s-verifier">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">ID</div>
                        <div id="s-id">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Points</div>
                        <div id="s-pts" style="color:var(--accent, #47e5bc)">-</div>
                    </div>
                    <div class="stat-card" id="fps-card" style="display: none;">
                        <div class="stat-label">FPS Cap</div>
                        <div id="s-fps" style="color:#ffcf4b">-</div>
                    </div>
                </div>

                <div class="victors-box">
                    <div class="stat-label">List Victors</div>
                    <div id="v-cont" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;"></div>
                </div>
            </div>

            <!-- Tier Legend -->
            <div id="tier-legend-container">
                <div class="stat-label" style="margin-bottom: 20px; font-weight:800; font-size: 0.95rem; letter-spacing:1.5px;">TIER LEGEND</div>
                <div id="legend-list"></div>
            </div>
        </div>
    </div>

    <!-- Floating Quick Actions -->
    <a href="rules.html" class="floating-btn rules-btn" title="Rules">
        <span style="font-size: 1.5rem; user-select: none;">📜</span>
    </a>

    <a href="https://discord.com/invite/7SjKU8vy8x" target="_blank" class="floating-btn discord-btn" title="Discord Community">
        <img src="discord.png" alt="Discord" style="width: 28px; height: 28px; object-fit: contain;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'%23ffffff\'><path d=\'M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 0 1-1.873-.894.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.195.373.289a.077.077 0 0 1-.006.127 12.298 12.298 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.156 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.156 2.418z\'/></svg>';">
    </a>

    <script>
        // Particle Background Canvas
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let parts = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            parts = [];
            for (let i = 0; i < 75; i++) {
                parts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    s: Math.random() * 2 + 0.5,
                    sp: Math.random() * 0.35 + 0.1
                });
            }
        }

        function animCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            parts.forEach(p => {
                ctx.fillStyle = "rgba(71, 229, 188, 0.25)";
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.sp;
                if (p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(animCanvas);
        }

        window.onresize = initCanvas;
        initCanvas();
        animCanvas();

        // --- LOGO CONFIGURATION ---
        const TIER_LOGO_SIZE = "36px";
        // ---------------------------

        let allLevels = [];
        let allTiers = [];
        let selectedIndex = 0;

        async function init() {
            try {
                const resTiers = await fetch(`tiers.json?v=${new Date().getTime()}`);
                allTiers = await resTiers.json();

                const res = await fetch(`levels.json?v=${new Date().getTime()}`);
                allLevels = await res.json();

                allLevels.sort((a, b) => b.points - a.points);

                renderSidebar(allLevels);

                const legendList = document.getElementById('legend-list');
                let legendHTML = "";

                [...allTiers].reverse().forEach(t => {
                    const logoSrc = t.image ? t.image : '';
                    const manualScale = t.size ? t.size : "100%";

                    legendHTML += `
                        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 16px; font-size: 0.95rem;">
                            <div style="width: ${TIER_LOGO_SIZE}; height: ${TIER_LOGO_SIZE}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                <img src="${logoSrc}" style="width: ${manualScale}; height: ${manualScale}; object-fit: contain; aspect-ratio: 1 / 1;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%23333\' stroke-width=\'1.5\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\'/></svg>';">
                            </div>
                            <span style="font-weight: 700; color: ${t.color}">${t.name}</span>
                            <span style="color: #888; margin-left: auto; font-size: 0.85rem; font-weight: 600;">${t.minPoints}${t.maxPoints > 9000 ? '+' : ' - ' + t.maxPoints} PTS</span>
                        </div>
                    `;
                });
                legendList.innerHTML = legendHTML;

                if (allLevels.length > 0) update(allLevels[0], 1);
            } catch (e) {
                console.error("Error loading levels layout:", e);
                document.getElementById('main-title').innerText = "Error loading list records.";
            }
        }

        function renderSidebar(levelsToRender) {
            const side = document.getElementById('sidebar');
            side.innerHTML = "";

            if (levelsToRender.length === 0) {
                side.innerHTML = `<div style="color: #666; font-size: 0.85rem; padding: 15px; text-align: center;">No levels found</div>`;
                return;
            }

            levelsToRender.forEach((lvl) => {
                const rank = allLevels.indexOf(lvl) + 1;

                if (rank === 1) {
                    const header = document.createElement('div');
                    header.style.cssText = "font-weight: 800; font-size: 0.85rem; color: var(--accent, #47e5bc); letter-spacing: 1.5px; text-transform: uppercase; padding: 12px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;";
                    header.innerText = "Main List";
                    side.appendChild(header);
                } else if (rank === 76) {
                    const header = document.createElement('div');
                    header.style.cssText = "font-weight: 800; font-size: 0.85rem; color: #aaa; letter-spacing: 1.5px; text-transform: uppercase; padding: 18px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;";
                    header.innerText = "Extended List";
                    side.appendChild(header);
                } else if (rank === 151) {
                    const legacyContainer = document.createElement('div');
                    legacyContainer.style.cssText = "display: flex; align-items: center; justify-content: space-between; padding: 18px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;";

                    const header = document.createElement('div');
                    header.style.cssText = "font-weight: 800; font-size: 0.85rem; color: #666; letter-spacing: 1.5px; text-transform: uppercase;";
                    header.innerText = "Legacy List";

                    const btn = document.createElement('a');
                    btn.href = "legacy.html";
                    btn.innerText = "VIEW ALL";
                    btn.style.cssText = "font-size: 0.7rem; font-weight: 700; color: var(--accent, #47e5bc); text-decoration: none; border: 1px solid var(--accent, #47e5bc); padding: 3px 8px; border-radius: 4px; transition: all 0.2s ease;";
                    btn.onmouseover = () => { btn.style.background = 'var(--accent, #47e5bc)'; btn.style.color = '#000'; };
                    btn.onmouseout = () => { btn.style.background = 'transparent'; btn.style.color = 'var(--accent, #47e5bc)'; };

                    legacyContainer.appendChild(header);
                    legacyContainer.appendChild(btn);
                    side.appendChild(legacyContainer);
                }

                const displayPts = rank > 150 ? "LEGACY" : `${lvl.points} PTS`;
                const fpsBadge = lvl.fps ? `<span style="font-size:0.65rem; color:#ffcf4b; border: 1px solid rgba(255, 207, 75, 0.3); padding: 1px 4px; border-radius: 3px; margin-left: 6px; flex-shrink: 0;">${lvl.fps}</span>` : '';

                const div = document.createElement('div');
                div.className = `list-item ${rank <= 3 ? 'top-' + rank : ''}`;

                const currentTier = allTiers.find(t => lvl.points >= t.minPoints && lvl.points <= t.maxPoints);
                if (currentTier) {
                    div.style.borderLeft = `4px solid ${currentTier.color}`;
                }

                const imgSource = lvl.thumbnail ? lvl.thumbnail : "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

                div.innerHTML = `
                    <div class="rank" style="${currentTier ? 'color:' + currentTier.color : ''}">#${rank}</div>
                    <img src="${imgSource}" class="thumb-mini">
                    <div style="flex: 1; min-width: 0; overflow: hidden; text-align: left;">
                        <div style="font-weight:700; font-size:0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center;">
                            <span style="overflow: hidden; text-overflow: ellipsis;">${lvl.name}</span>
                            ${fpsBadge}
                        </div>
                        <div style="font-size:0.72rem; color:#777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; margin-top:2px;">${displayPts}</div>
                    </div>
                `;

                div.onclick = () => {
                    document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    update(lvl, rank);
                };

                side.appendChild(div);
            });
        }

        function filterLevels() {
            const query = document.getElementById('level-search').value.toLowerCase().trim();
            const filtered = allLevels.filter(lvl => lvl.name.toLowerCase().includes(query));
            renderSidebar(filtered);
        }

        function update(lvl, rank) {
            document.getElementById('main-title').innerText = `#${rank} - ${lvl.name}`;
            document.getElementById('s-creator').innerText = lvl.creator || 'Unknown';

            document.getElementById('s-verifier').innerHTML = lvl.verifier 
                ? `<a href="player.html?name=${encodeURIComponent(lvl.verifier)}" class="player-link">${lvl.verifier}</a>` 
                : '-';

            document.getElementById('s-id').innerText = lvl.id || '-';
            document.getElementById('s-pts').innerText = rank > 150 ? "LEGACY" : lvl.points;

            const fpsCard = document.getElementById('fps-card');
            if (lvl.fps) {
                document.getElementById('s-fps').innerText = lvl.fps;
                fpsCard.style.display = "flex";
            } else {
                fpsCard.style.display = "none";
            }

            const vid = document.getElementById('main-vid');
            if (lvl.video) {
                if (lvl.video.includes('medal')) {
                    vid.src = `https://medal.tv/clip/${lvl.video.split('/').pop()}`;
                } else if (lvl.video.includes('youtube.com/watch?v=')) {
                    const urlParams = new URLSearchParams(lvl.video.split('?')[1]);
                    vid.src = `https://www.youtube.com/embed/${urlParams.get('v')}`;
                } else if (lvl.video.includes('youtu.be/')) {
                    vid.src = `https://www.youtube.com/embed/${lvl.video.split('/').pop()}`;
                } else {
                    vid.src = `https://www.youtube.com/embed/${lvl.video}`;
                }
            } else {
                vid.src = '';
            }

            const validVictors = lvl.victors ? lvl.victors.filter(v => v.trim() !== "") : [];

            const vCont = document.getElementById('v-cont');
            vCont.innerHTML = validVictors.length > 0
                ? validVictors.map(v => `<a href="player.html?name=${encodeURIComponent(v)}" class="tag player-link" style="white-space: nowrap; display: inline-block;">${v}</a>`).join('')
                : "<span style='color:#555; font-size:0.85rem'>No victors yet.</span>";
        }

        init();
    </script>
</body>
</html>
