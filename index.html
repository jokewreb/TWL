<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-js"></div>

    <nav>
        <div class="logo">WAVE LIST</div>
        <button class="btn-leaderboard" id="lb-btn">LEADERBOARD</button>
    </nav>

    <div class="app-container">
        <aside class="sidebar" id="side-list">
            </aside>

        <main class="main-view">
            <div class="level-hero">
                <div class="video-box">
                    <iframe id="hero-video" src="" allowfullscreen></iframe>
                </div>
                
                <h1 id="hero-name" style="margin: 0 0 25px 0; font-size: 2.5rem; font-weight: 800;">Loading...</h1>

                <div class="info-grid">
                    <div class="stat-card">
                        <div class="stat-label">Creator</div>
                        <div id="hero-creator" class="stat-value">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Verifier</div>
                        <div id="hero-verifier" class="stat-value">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">List ID</div>
                        <div id="hero-id" class="stat-value">-</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="leaderboard-overlay" id="lb-overlay">
        <div class="lb-modal">
            <span class="close-lb" id="lb-close">✕</span>
            <h2 style="margin: 0 0 30px 0; font-size: 2rem;">Top Players</h2>
            <div id="lb-content"></div>
        </div>
    </div>

    <script>
        let levels = [];

        // 1. Fetch and Populate
        async function start() {
            try {
                const res = await fetch('./levels.json');
                levels = await res.json();
                levels.sort((a, b) => b.points - a.points);

                const container = document.getElementById('side-list');
                container.innerHTML = '';

                levels.forEach((l, i) => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    
                    let thumb = `https://img.youtube.com/vi/${l.video}/mqdefault.jpg`;
                    if(l.video.includes('medal')) thumb = "https://cdn.medal.tv/assets/img/medal-logo.png";

                    div.innerHTML = `
                        <div class="item-rank">#${i+1}</div>
                        <img src="${thumb}" class="item-thumb">
                        <div>
                            <div class="item-name">${l.name}</div>
                            <div class="item-pts">${l.points} POINTS</div>
                        </div>
                    `;
                    div.onclick = () => updateHero(l, i+1);
                    container.appendChild(div);
                });

                updateHero(levels[0], 1);
                buildLeaderboard();
            } catch (e) { console.error("Error:", e); }
        }

        function updateHero(l, rank) {
            document.getElementById('hero-name').innerText = `#${rank} ${l.name}`;
            document.getElementById('hero-creator').innerText = l.creator;
            document.getElementById('hero-verifier').innerText = l.verifier;
            document.getElementById('hero-id').innerText = l.id;

            const v = document.getElementById('hero-video');
            if(l.video.includes('medal')) {
                const id = l.video.split('/clips/')[1]?.split('?')[0];
                v.src = `https://medal.tv/clip/${id}`;
            } else {
                v.src = `https://www.youtube.com/embed/${l.video}`;
            }
        }

        // 2. Leaderboard Logic
        function buildLeaderboard() {
            const scores = {};
            levels.forEach(l => {
                scores[l.verifier] = (scores[l.verifier] || 0) + l.points;
            });

            const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
            const content = document.getElementById('lb-content');
            content.innerHTML = sorted.map(([name, pts], i) => `
                <div class="lb-entry">
                    <span>#${i+1} ${name}</span>
                    <b>${pts} Pts</b>
                </div>
            `).join('');
        }

        // 3. Robust Modal Controls
        const overlay = document.getElementById('lb-overlay');
        document.getElementById('lb-btn').onclick = () => overlay.style.display = 'flex';
        document.getElementById('lb-close').onclick = () => overlay.style.display = 'none';
        window.onclick = (e) => { if(e.target == overlay) overlay.style.display = 'none'; }

        start();
    </script>
</body>
</html>
