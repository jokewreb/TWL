<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    <nav>
        <div class="nav-logo">THE WAVE LIST</div>
        <a href="leaderboard.html" class="nav-link">LEADERBOARD</a>
    </nav>

    <div class="main-layout">
        <div class="sidebar" id="sidebar"></div>
        
        <div class="content">
            <div class="glass-card">
                <div class="video-box">
                    <iframe id="main-vid" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
                </div>
                
                <h1 id="main-title">Select a Level</h1>
                
                <div class="info-grid">
                    <div class="stat-card"><div class="stat-label">Creator</div><div id="s-creator">-</div></div>
                    <div class="stat-card"><div class="stat-label">Verifier</div><div id="s-verifier">-</div></div>
                    <div class="stat-card"><div class="stat-label">Level ID</div><div id="s-id">-</div></div>
                    <div class="stat-card"><div class="stat-label">Points</div><div id="s-pts">-</div></div>
                </div>

                <div class="victors-section">
                    <div class="stat-label">List Victors</div>
                    <div id="v-cont">None</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Clean names for the leaderboard/victors
        const clean = (n) => n.replace(/\./g, '').trim();

        async function init() {
            try {
                const res = await fetch('./levels.json');
                if (!res.ok) throw new Error("Could not find levels.json");
                const data = await res.json();
                const side = document.getElementById('sidebar');

                data.forEach((lvl, i) => {
                    const rank = i + 1;
                    const div = document.createElement('div');
                    div.className = `list-item ${rank <= 3 ? 'top-'+rank : ''}`;
                    
                    // Logic for custom image or placeholder
                    const imgSource = lvl.thumbnail ? lvl.thumbnail : "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

                    div.innerHTML = `
                        <div class="rank">#${rank}</div>
                        <img src="${imgSource}" class="thumb-mini">
                        <div class="list-info">
                            <div class="l-name">${lvl.name}</div>
                            <div class="l-pts">${lvl.points} PTS</div>
                        </div>
                    `;
                    div.onclick = () => update(lvl, rank);
                    side.appendChild(div);
                });
                if(data.length > 0) update(data[0], 1);
            } catch (e) {
                document.getElementById('main-title').innerText = "Error: levels.json not found";
                console.error(e);
            }
        }

        function update(lvl, rank) {
            document.getElementById('main-title').innerText = `#${rank} - ${lvl.name}`;
            document.getElementById('s-creator').innerText = lvl.creator;
            document.getElementById('s-verifier').innerText = lvl.verifier;
            document.getElementById('s-id').innerText = lvl.id;
            document.getElementById('s-pts').innerText = lvl.points;

            const vid = document.getElementById('main-vid');
            // Support for YouTube and Medal
            if (lvl.video.includes('medal')) {
                vid.src = `https://medal.tv/clip/${lvl.video.split('/').pop()}`;
            } else {
                vid.src = `https://www.youtube.com/embed/${lvl.video}`;
            }

            const vCont = document.getElementById('v-cont');
            vCont.innerHTML = lvl.victors.length > 0 
                ? lvl.victors.map(v => `<span class="tag">${v}</span>`).join('') 
                : "No victors yet.";
        }
        init();
    </script>
</body>
</html>
