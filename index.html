<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-logo">THE WAVE LIST</div>
        <div>
            <a href="roulette.html" class="nav-link" style="margin-right: 20px;">ROULETTE</a>
            <a href="leaderboard.html" class="nav-link">LEADERBOARD</a>
        </div>
    </nav>

    <div class="main-layout">
        <div class="sidebar" id="sidebar"></div>
        <div class="content">
            <div style="display: flex; gap: 30px; width: 100%; max-width: 1650px; align-items: flex-start;">
                
                <div class="glass-card" style="flex: 1; max-width: 1150px; margin: 0;">
                    <div class="video-box">
                        <iframe id="main-vid" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <h1 id="main-title" style="margin:0; font-size: 1.5rem;"></h1>
                    <div class="info-grid">
                        <div class="stat-card"><div class="stat-label">Creator</div><div id="s-creator">-</div></div>
                        <div class="stat-card"><div class="stat-label">Verifier</div><div id="s-verifier">-</div></div>
                        <div class="stat-card"><div class="stat-label">ID</div><div id="s-id">-</div></div>
                        <div class="stat-card"><div class="stat-label">Points</div><div id="s-pts" style="color:var(--accent)">-</div></div>
                    </div>
                    <div class="victors-box">
                        <div class="stat-label">List Victors</div>
                        <div id="v-cont" style="margin-top:10px;"></div>
                    </div>
                </div>

                <div id="tier-legend-container" style="width: 340px; min-width: 340px; background: rgba(20, 22, 30, 0.95); border: 1px solid var(--border); border-radius: 12px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: sticky; top: 0px;">
                    <div class="stat-label" style="margin-bottom: 20px; font-weight:700; font-size: 0.95rem; letter-spacing:1px;">TIER LEGEND</div>
                    <div id="legend-list"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- LOGO CONFIGURATION ---
        // Base container layout size for tier logos
        const TIER_LOGO_SIZE = "36px"; 
        // ---------------------------

        async function init() {
            try {
                // Fetch tier settings from your external configuration file
                const resTiers = await fetch(`tiers.json?v=${new Date().getTime()}`);
                const tiers = await resTiers.json();

                // Bypasses local browser caching to ensure changes to levels.json drop instantly
                const res = await fetch(`levels.json?v=${new Date().getTime()}`);
                const data = await res.json();
                const side = document.getElementById('sidebar');

                // Sort levels by points in descending order (highest points first)
                data.sort((a, b) => b.points - a.points);

                side.innerHTML = ""; // Clear sidebar to load sorted items

                data.forEach((lvl, i) => {
                    const rank = i + 1;
                    const div = document.createElement('div');
                    div.className = `list-item ${rank <= 3 ? 'top-'+rank : ''}`;
                    
                    // Match the tier configuration based on level points range
                    const currentTier = tiers.find(t => lvl.points >= t.minPoints && lvl.points <= t.maxPoints);
                    if (currentTier) {
                        div.style.borderLeft = `4px solid ${currentTier.color}`;
                    }
                    
                    // Uses custom image path from JSON (including folder names), or a black placeholder if missing
                    const imgSource = lvl.thumbnail ? lvl.thumbnail : "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

                    div.innerHTML = `
                        <div class="rank" style="${currentTier ? 'color:' + currentTier.color : ''}">#${rank}</div>
                        <img src="${imgSource}" class="thumb-mini" style="width: 80px; height: 45px; object-fit: cover;">
                        <div>
                            <div style="font-weight:700; font-size:0.85rem">${lvl.name}</div>
                            <div style="font-size:0.7rem; color:#666">${lvl.points} PTS</div>
                        </div>
                    `;
                    div.onclick = () => update(lvl, rank);
                    side.appendChild(div);
                });

                // --- Render Tiers Legend Side-Panel ---
                const legendList = document.getElementById('legend-list');
                let legendHTML = "";
                
                // Loops through tiers in reverse order (highest tiers at the top)
                [...tiers].reverse().forEach(t => {
                    // Pulls the image string value directly from your tiers.json file setup
                    const logoSrc = t.image ? t.image : ''; 
                    
                    // Checks if a custom manual scale exists in JSON (e.g. "125%"), default back to "100%" if missing
                    const manualScale = t.size ? t.size : "100%";

                    legendHTML += `
                        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 16px; font-size: 1rem;">
                            <div style="width: ${TIER_LOGO_SIZE}; height: ${TIER_LOGO_SIZE}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                <img src="${logoSrc}" style="width: ${manualScale}; height: ${manualScale}; object-fit: contain; aspect-ratio: 1 / 1;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%23333\' stroke-width=\'1.5\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'2\'/></svg>';">
                            </div>
                            <span style="font-weight: 700; color: ${t.color}">${t.name}</span>
                            <span style="color: #888; margin-left: auto; font-size: 0.9rem; font-weight: 500;">${t.minPoints}${t.maxPoints > 9000 ? '+' : ' - ' + t.maxPoints} PTS</span>
                        </div>
                    `;
                });
                legendList.innerHTML = legendHTML;
                // --------------------------------------

                if(data.length > 0) update(data[0], 1);
            } catch(e) {
                console.error("Error loading levels layout:", e);
                document.getElementById('main-title').innerText = "Error loading list records.";
            }
        }

        function update(lvl, rank) {
            document.getElementById('main-title').innerText = `#${rank} - ${lvl.name}`;
            document.getElementById('s-creator').innerText = lvl.creator;
            document.getElementById('s-verifier').innerText = lvl.verifier;
            document.getElementById('s-id').innerText = lvl.id;
            document.getElementById('s-pts').innerText = lvl.points;

            const vid = document.getElementById('main-vid');
            if(lvl.video && lvl.video.length > 11) {
                vid.src = lvl.video.includes('medal') ? `https://medal.tv/clip/${lvl.video.split('/').pop()}` : `https://www.youtube.com/embed/${lvl.video}`;
            } else {
                vid.src = lvl.video ? `https://www.youtube.com/embed/${lvl.video}` : '';
            }

            const vCont = document.getElementById('v-cont');
            vCont.innerHTML = lvl.victors && lvl.victors.length > 0 ? lvl.victors.map(v => `<span class="tag">${v}</span>`).join('') : "<span style='color:#444; font-size:0.8rem'>No victors yet.</span>";
        }
        init();
    </script>
</body>
</html>
