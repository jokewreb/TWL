<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE WAVE LIST | V2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-logo">THE WAVE LIST</div>
        <a href="leaderboard.html" class="nav-link">LEADERBOARD</a>
    </nav>

    <div class="main-layout">
        <div class="sidebar" id="sidebar"></div>
        
        <div class="content">
            <div class="glass-card">
                <div class="video-box">
                    <iframe id="main-vid" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
                </div>
                
                <h1 id="main-title" style="margin:0; font-size: 1.6rem;">Loading...</h1>
                
                <div class="info-grid">
                    <div class="stat-card"><div class="stat-label">Creator</div><div id="s-creator">-</div></div>
                    <div class="stat-card"><div class="stat-label">Verifier</div><div id="s-verifier">-</div></div>
                    <div class="stat-card"><div class="stat-label">Level ID</div><div id="s-id">-</div></div>
                    <div class="stat-card"><div class="stat-label">Points</div><div id="s-pts" style="color:var(--accent)">-</div></div>
                </div>

                <div class="victors-section">
                    <div class="stat-label" style="margin-bottom:10px">List Victors</div>
                    <div id="victor-container">None</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function run() {
            try {
                const response = await fetch('./levels.json');
                const levels = await response.json();
                const sidebar = document.getElementById('sidebar');

                levels.forEach((lvl, i) => {
                    const item = document.createElement('div');
                    item.className = `list-item ${i === 0 ? 'top-1' : ''}`;
                    
                    let thumb = lvl.video.includes('medal') 
                        ? "https://cdn.medal.tv/assets/img/medal-logo.png" 
                        : `https://img.youtube.com/vi/${lvl.video}/mqdefault.jpg`;

                    item.innerHTML = `
                        <div class="rank">#${i + 1}</div>
                        <img src="${thumb}" class="thumb-mini">
                        <div>
                            <div style="font-weight:700; font-size:0.85rem">${lvl.name}</div>
                            <div style="font-size:0.7rem; color:var(--text-dim)">${lvl.points} PTS</div>
                        </div>
                    `;
                    item.onclick = () => update(lvl, i + 1);
                    sidebar.appendChild(item);
                });

                // Auto-load #1
                update(levels[0], 1);

            } catch (error) {
                console.error("Error loading levels:", error);
            }
        }

        function update(lvl, rank) {
            document.getElementById('main-title').innerText = `#${rank} - ${lvl.name}`;
            document.getElementById('s-creator').innerText = lvl.creator;
            document.getElementById('s-verifier').innerText = lvl.verifier;
            document.getElementById('s-id').innerText = lvl.id;
            document.getElementById('s-pts').innerText = lvl.points;

            const vid = document.getElementById('main-vid');
            if (lvl.video.length > 11) {
                vid.src = `https://medal.tv/clip/${lvl.video.split('/').pop()}`;
            } else {
                vid.src = `https://www.youtube.com/embed/${lvl.video}`;
            }

            const vCont = document.getElementById('victor-container');
            vCont.innerHTML = lvl.victors.length > 0 
                ? lvl.victors.map(v => `<span class="victor-pill">${v}</span>`).join('') 
                : "No verified victors yet.";
        }

        run();
    </script>
</body>
</html>
