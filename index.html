<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Wave List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav><h1>THE WAVE LIST</h1></nav>

    <div class="wrapper">
        <div class="sidebar" id="sidebar-list"></div>
        <div class="main-content">
            <div class="card">
                <div class="video-box">
                    <iframe id="display-video" src="" allowfullscreen></iframe>
                </div>
                <h2 id="display-title" style="font-size: 2.5rem; margin-bottom: 10px;">Select a Level</h2>
                <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
                
                <div class="stats-container">
                    <div class="stat-item"><small>Creator</small><div id="stat-creator">-</div></div>
                    <div class="stat-item"><small>Verifier</small><div id="stat-verifier">-</div></div>
                    <div class="stat-item"><small>Level ID</small><div id="stat-id">-</div></div>
                    <div class="stat-item"><small>Points</small><div id="stat-points" style="color:var(--accent)">-</div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            const response = await fetch('levels.json');
            let levels = await response.json();

            // Sort by points as seen in Screenshot 2026-05-14 153404.png
            levels.sort((a, b) => b.points - a.points);

            const sidebar = document.getElementById('sidebar-list');
            levels.forEach((lvl, index) => {
                const rank = index + 1;
                const div = document.createElement('div');
                
                let rankClass = "";
                if(rank === 1) rankClass = "rank-1";
                else if(rank === 2) rankClass = "rank-2";
                else if(rank === 3) rankClass = "rank-3";

                div.className = `list-item ${rankClass}`;
                div.innerHTML = `<div class="level-info"><b>#${rank} ${lvl.name}</b><i>${lvl.points} PTS</i></div>`;
                div.onclick = () => updateInfo(lvl, rank);
                sidebar.appendChild(div);
            });
            updateInfo(levels[0], 1);
        }

        function updateInfo(lvl, rank) {
            document.getElementById('display-title').innerText = `#${rank} ${lvl.name}`;
            document.getElementById('stat-creator').innerText = lvl.creator;
            document.getElementById('stat-verifier').innerText = lvl.verifier;
            document.getElementById('stat-id').innerText = lvl.id;
            document.getElementById('stat-points').innerText = lvl.points;
            
            const video = document.getElementById('display-video');
            if(lvl.video.includes('medal.tv')) {
                const clipId = lvl.video.split('/clips/')[1]?.split('?')[0];
                video.src = `https://medal.tv/clip/${clipId}`;
            } else {
                video.src = `https://www.youtube.com/embed/${lvl.video || 'dQw4w9WgXcQ'}`;
            }
        }
        init();
    </script>
</body>
</html>
