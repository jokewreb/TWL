<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE WAVE LIST - SUBMIT RECORD</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .submit-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .submit-card {
            width: 100%;
            background: rgba(20, 22, 30, 0.8);
            border: 1px solid var(--border, rgba(255,255,255,0.05));
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
        }
        .form-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            text-align: center;
        }
        .form-sub {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
            text-align: left;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(10, 11, 15, 0.8);
            border: 1px solid var(--border, rgba(255,255,255,0.1));
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent, #47e5bc);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .submit-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo" onclick="window.location.href='index.html'" style="cursor:pointer;">THE WAVE LIST</div>
        <div>
            <a href="index.html" class="nav-link" style="margin-right: 20px;">BACK TO LIST</a>
            <a href="submissions.html" class="nav-link">PENDING SUBMISSIONS</a>
        </div>
    </nav>

    <div class="main-layout" style="display: block; padding: 40px 20px;">
        <div class="submit-container">
            <h2 class="form-title">SUBMIT A RECORD</h2>
            <div class="form-sub">Send run data to pending list</div>

            <div class="submit-card">
                <form id="recordForm" onsubmit="handleSubmit(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="playerName">Player Name</label>
                            <input type="text" id="playerName" placeholder="Your in-game name" required>
                        </div>
                        <div class="form-group">
                            <label for="levelName">Name</label>
                            <input type="text" id="levelName" placeholder="Name of the wave level" required>
                        </div>
                        <div class="form-group">
                            <label for="levelId">ID</label>
                            <input type="text" id="levelId" placeholder="Geometry Dash Level ID" required>
                        </div>
                        <div class="form-group">
                            <label for="levelCreator">Creator</label>
                            <input type="text" id="levelCreator" placeholder="Level creator's name" required>
                        </div>
                        <div class="form-group">
                            <label for="levelVerifier">Verifier</label>
                            <input type="text" id="levelVerifier" placeholder="Level verifier's name" required>
                        </div>
                        <div class="form-group">
                            <label for="levelDifficulty">Difficulty</label>
                            <input type="text" id="levelDifficulty" placeholder="e.g., Tier 5" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="videoLink">YouTube Video / Proof Link</label>
                            <input type="url" id="videoLink" placeholder="https://www.youtube.com/watch?v=..." required>
                        </div>
                        <div class="form-group full-width">
                            <label style="color: var(--accent, #47e5bc);">Image of Thumbnail (Upload on next step)</label>
                            <div style="font-size: 0.85rem; color: #888; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px dashed #444;">
                                Leave the placeholder line on GitHub as-is, and simply <strong>Drag & Drop</strong> or <strong>Paste (Ctrl+V)</strong> your image directly into the text box on the next screen!
                            </div>
                        </div>
                        <div class="form-group full-width">
                            <label for="extraNotes">Extra Notes</label>
                            <textarea id="extraNotes" placeholder="Any additional information..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">Create GitHub Submission</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USER = "jokewreb";
        const GITHUB_REPO = "TWL";

        function handleSubmit(event) {
            event.preventDefault();
            
            const player = document.getElementById('playerName').value;
            const name = document.getElementById('levelName').value;
            const id = document.getElementById('levelId').value;
            const creator = document.getElementById('levelCreator').value;
            const verifier = document.getElementById('levelVerifier').value;
            const difficulty = document.getElementById('levelDifficulty').value;
            const video = document.getElementById('videoLink').value;
            const notes = document.getElementById('extraNotes').value || "None";

            const title = encodeURIComponent(`[SUBMISSION] ${name} by ${player}`);
            
            const body = encodeURIComponent(
`PLAYER: ${player}
NAME: ${name}
ID: ${id}
CREATOR: ${creator}
VERIFIER: ${verifier}
DIFFICULTY: ${difficulty}
YOUTUBE VIDEO: ${video}
IMAGE OF THUMBNAIL: [Drop your image right here!]
EXTRA NOTES: ${notes}`
            );

            window.open(`https://github.com/${GITHUB_USER}/${GITHUB_REPO}/issues/new?title=${title}&body=${body}`, '_blank');
        }
    </script>
</body>
</html>
