<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WAVE LIST - PLAYER PROFILE</title>
    <link rel="icon" type="image/png" href="logo.ico">

    <style>
        :root {
            --accent: #47e5bc;
            --gold: #ffcf4b;
            --bg-dark: #0b0c10;
            --card-bg: rgba(18, 22, 31, 0.88);
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) #0b0c10;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-dark);
            font-family: 'Inter', system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto !important;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        nav {
            position: relative;
            z-index: 100;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            width: 100%;
            height: 64px;
        }

        .nav-logo {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-logo:hover {
            color: var(--accent);
        }

        .nav-link {
            color: #aaa;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .profile-container {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .profile-header {
            position: relative;
            text-align: center;
            margin-bottom: 50px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .profile-bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            filter: blur(6px);
            z-index: 0;
            pointer-events: none;
            transition: background-image 0.4s ease;
        }

        .profile-bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at center,
                rgba(11, 12, 16, 0.5) 0%,
                rgba(11, 12, 16, 0.85) 100%
            );
            z-index: 0;
            pointer-events: none;
        }

        .profile-header-content {
            position: relative;
            z-index: 1;
        }

        .profile-name {
            font-size: 3rem;
            font-weight: 900;
            margin: 0 0 16px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        /* ==========================================
           PLAYER TIER SYSTEM
           ========================================== */

        .player-tier-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 430px;
            margin: 0 auto 22px auto;
        }

        .player-tier-image {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
            margin-bottom: 8px;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
        }

        .player-tier-name {
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .tier-progress-container {
            width: 100%;
        }

        .tier-progress-track {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .tier-progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 0.8s ease;
            box-shadow: 0 0 12px currentColor;
        }

        .tier-progress-text {
            margin-top: 7px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* ==========================================
           TIER NAME EFFECTS
           ========================================== */

        .tier-bronze {
            color: #cd7f32 !important;
            text-shadow: 0 0 12px rgba(205, 127, 50, 0.45);
        }

        .tier-silver {
            color: #c0c0c0 !important;
            text-shadow: 0 0 12px rgba(192, 192, 192, 0.45);
        }

        .tier-gold {
            color: #ffd700 !important;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.55);
        }

        .tier-platinum {
            color: #e5e4e2 !important;
            text-shadow:
                0 0 10px rgba(229, 228, 226, 0.6),
                0 0 25px rgba(229, 228, 226, 0.25);
        }

        .tier-diamond {
            color: #b9f2ff !important;
            text-shadow:
                0 0 12px rgba(185, 242, 255, 0.7),
                0 0 28px rgba(185, 242, 255, 0.35);
        }

        .tier-wave-master {
            background: linear-gradient(
                90deg,
                #ff4141,
                #ff8a00,
                #ffe600,
                #47e5bc,
                #4aa3ff,
                #b86cff,
                #ff4141
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: waveMasterGradient 4s ease-in-out infinite;
            text-shadow: none;
        }

        @keyframes waveMasterGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .stats-badges-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stats-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .hardest-badge {
            background: rgba(255, 207, 75, 0.1);
            color: var(--gold);
            border-color: rgba(255, 207, 75, 0.25);
        }

        .points-badge {
            background: rgba(71, 229, 188, 0.1);
            color: var(--accent);
            border-color: rgba(71, 229, 188, 0.3);
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 800;
            margin: 45px 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #fff;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }

        .completed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 22px;
        }

        .level-card {
            position: relative;
            background: rgba(18, 22, 31, 0.85);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .level-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 16px 35px rgba(0,0,0,0.7);
        }

        .level-card-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            transition: all 0.4s ease;
            z-index: 0;
        }

        .level-card:hover .level-card-bg {
            opacity: 0.7;
            transform: scale(1.05);
        }

        .level-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(11, 12, 16, 0.93) 0%,
                rgba(11, 12, 16, 0.75) 100%
            );
            z-index: 1;
        }

        .level-info {
            position: relative;
            z-index: 2;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .level-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .level-meta {
            font-size: 0.88rem;
            color: #ccc;
            font-weight: 500;
        }

        .unbeaten-card {
            opacity: 0.65;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .unbeaten-card .level-card-bg {
            filter: grayscale(90%);
            opacity: 0.2;
        }

        .tier-PLATINUM {
            border-color: #e5e4e2 !important;
            color: #e5e4e2 !important;
        }

        .tier-DIAMOND {
            border-color: #b9f2ff !important;
            color: #b9f2ff !important;
        }

        .tier-SILVER {
            border-color: #c0c0c0 !important;
            color: #c0c0c0 !important;
        }

        .tier-BRONZE {
            border-color: #cd7f32 !important;
            color: #cd7f32 !important;
        }

        @media (max-width: 768px) {

            nav {
                padding: 14px 18px;
            }

            .nav-logo {
                font-size: 1.05rem;
            }

            .nav-link {
                font-size: 0.72rem;
                padding: 6px 8px;
            }

            .profile-container {
                margin: 25px auto;
                padding: 0 14px;
            }

            .profile-header {
                padding: 30px 18px;
                margin-bottom: 35px;
            }

            .profile-name {
                font-size: 2.2rem;
            }

            .player-tier-image {
                width: 75px;
                height: 75px;
            }

            .player-tier-name {
                font-size: 0.85rem;
            }

            .completed-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 1.15rem;
            }
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>

    <nav>
        <div
            class="nav-logo"
            onclick="window.location.href='index.html'"
        >
            THE WAVE LIST
        </div>

        <div>
            <a
                href="index.html"
                class="nav-link"
            >
                BACK TO LIST
            </a>
        </div>
    </nav>


    <div class="profile-container">

        <div class="profile-header">

            <div
                id="profileBg"
                class="profile-bg-layer"
            ></div>

            <div class="profile-bg-overlay"></div>

            <div class="profile-header-content">

                <h1
                    id="playerNameHeading"
                    class="profile-name"
                >
                    LOADING...
                </h1>

                <!-- ==========================================
                     PLAYER TIER
                     ========================================== -->

                <div
                    id="playerTierContainer"
                    class="player-tier-container"
                >

                    <img
                        id="playerTierImage"
                        class="player-tier-image"
                        src=""
                        alt="Player Tier"
                    >

                    <div
                        id="playerTierName"
                        class="player-tier-name"
                    >
                        LOADING TIER...
                    </div>

                    <div class="tier-progress-container">

                        <div class="tier-progress-track">

                            <div
                                id="tierProgressFill"
                                class="tier-progress-fill"
                            ></div>

                        </div>

                        <div class="tier-progress-text">

                            <span id="tierProgressCurrent">
                                0 PTS
                            </span>

                            <span id="tierProgressNext">
                                NEXT TIER
                            </span>

                        </div>

                    </div>

                </div>

                <div class="stats-badges-container">

                    <div
                        id="totalPoints"
                        class="stats-badge points-badge"
                    >
                        0 PTS
                    </div>

                    <div
                        id="completionCount"
                        class="stats-badge"
                    >
                        0 COMPLETIONS
                    </div>

                    <div
                        id="hardestLevel"
                        class="stats-badge hardest-badge"
                        style="display:none;"
                    >
                        HARDEST: NONE
                    </div>

                </div>

            </div>

        </div>


        <h2 class="section-title">
            Completed Packs
        </h2>

        <div
            id="packsGrid"
            class="completed-grid"
        ></div>


        <h2 class="section-title">
            Completed Levels
        </h2>

        <div
            id="completedGrid"
            class="completed-grid"
        ></div>


        <h2 class="section-title">
            Created Levels
        </h2>

        <div
            id="createdGrid"
            class="completed-grid"
        ></div>


        <h2
            class="section-title"
            style="border-color:#555;"
        >
            Non-Completed Levels
        </h2>

        <div
            id="unbeatenGrid"
            class="completed-grid"
        ></div>

    </div>


    <script>

        // ==========================================
        // PARTICLE BACKGROUND
        // ==========================================

        const canvas =
            document.getElementById('bg-canvas');

        const ctx =
            canvas.getContext('2d');

        let particles = [];


        function initCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

            particles = [];


            for (let i = 0; i < 65; i++) {

                particles.push({

                    x:
                        Math.random() *
                        canvas.width,

                    y:
                        Math.random() *
                        canvas.height,

                    radius:
                        Math.random() * 2 + 0.5,

                    speed:
                        Math.random() * 0.3 + 0.1

                });

            }

        }


        function animateCanvas() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            particles.forEach(p => {

                ctx.fillStyle =
                    "rgba(71, 229, 188, 0.2)";

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                p.y -= p.speed;


                if (p.y < 0) {

                    p.y =
                        canvas.height;

                }

            });


            requestAnimationFrame(
                animateCanvas
            );

        }


        window.addEventListener(
            'resize',
            initCanvas
        );

        initCanvas();
        animateCanvas();


        // ==========================================
        // PLAYER
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const targetPlayer =
            urlParams.get('name');


        // ==========================================
        // LOAD PLAYER PROFILE
        // ==========================================

        async function loadPlayerProfile() {

            const nameHeading =
                document.getElementById(
                    'playerNameHeading'
                );

            const totalPointsBadge =
                document.getElementById(
                    'totalPoints'
                );

            const countBadge =
                document.getElementById(
                    'completionCount'
                );

            const hardestBadge =
                document.getElementById(
                    'hardestLevel'
                );

            const profileBg =
                document.getElementById(
                    'profileBg'
                );

            const packsGrid =
                document.getElementById(
                    'packsGrid'
                );

            const grid =
                document.getElementById(
                    'completedGrid'
                );

            const creationsGrid =
                document.getElementById(
                    'createdGrid'
                );

            const unbeatenGrid =
                document.getElementById(
                    'unbeatenGrid'
                );


            if (!targetPlayer) {

                nameHeading.innerText =
                    "PLAYER NOT FOUND";

                return;

            }


            nameHeading.innerText =
                targetPlayer;


            try {

                // ==========================================
                // LOAD LEVELS + PACKS + PLAYER TIERS
                // ==========================================

                const [
                    levelsResponse,
                    packsResponse,
                    tiersResponse
                ] = await Promise.all([

                    fetch(
                        `levels.json?v=${Date.now()}`
                    ),

                    fetch(
                        `packs.json?v=${Date.now()}`
                    ),

                    fetch(
                        `player-tiers.json?v=${Date.now()}`
                    )

                ]);


                const data =
                    await levelsResponse.json();

                const packs =
                    await packsResponse.json();

                const playerTiers =
                    await tiersResponse.json();


                // ==========================================
                // SORT LEVELS
                // ==========================================

                data.sort(
                    (a, b) =>
                        Number(b.points || 0) -
                        Number(a.points || 0)
                );


                let totalPoints = 0;
                let completionCount = 0;
                let creationCount = 0;
                let unbeatenCount = 0;

                let hardestLvl = null;
                let hardestRank = 0;

                const beatenLevelNames = [];


                packsGrid.innerHTML = "";
                grid.innerHTML = "";
                creationsGrid.innerHTML = "";
                unbeatenGrid.innerHTML = "";


                // ==========================================
                // LEVEL MAP
                // ==========================================

                const levelMap = {};


                data.forEach((level, index) => {

                    levelMap[
                        level.name.toLowerCase()
                    ] = {

                        ...level,

                        rank: index + 1

                    };

                });


                // ==========================================
                // PROCESS EVERY LEVEL
                // ==========================================

                data.forEach((level, index) => {

                    const rank =
                        index + 1;


                    const hasBeaten =
                        Array.isArray(level.victors) &&
                        level.victors.some(
                            v =>
                                v.toLowerCase() ===
                                targetPlayer.toLowerCase()
                        );


                    const isVerifier =
                        level.verifier &&
                        level.verifier.toLowerCase() ===
                        targetPlayer.toLowerCase();


                    const isCreator =
                        level.creator &&
                        level.creator.toLowerCase() ===
                        targetPlayer.toLowerCase();


                    const imgSource =
                        level.thumbnail || "";


                    // ==========================================
                    // COMPLETED / VERIFIED LEVELS
                    // ==========================================

                    if (
                        hasBeaten ||
                        isVerifier
                    ) {

                        completionCount++;


                        beatenLevelNames.push(
                            level.name.toLowerCase()
                        );


                        /*
                         * ONLY TOP 150 LEVELS
                         * GIVE POINTS.
                         *
                         * Legacy levels = 0 points.
                         */

                        if (rank <= 150) {

                            totalPoints +=
                                Number(
                                    level.points || 0
                                );

                        }


                        // Hardest level
                        if (
                            !hardestLvl ||
                            Number(level.points || 0) >
                            Number(hardestLvl.points || 0)
                        ) {

                            hardestLvl =
                                level;

                            hardestRank =
                                rank;

                        }


                        const card =
                            document.createElement(
                                'div'
                            );

                        card.className =
                            'level-card';


                        card.innerHTML = `

                            <div
                                class="level-card-bg"
                                style="
                                    background-image:url('${imgSource}');
                                "
                            ></div>

                            <div
                                class="level-card-overlay"
                            ></div>

                            <div
                                class="level-info"
                            >

                                <h3
                                    class="level-title"
                                >
                                    #${rank} -
                                    ${level.name}
                                </h3>

                                <div
                                    class="level-meta"
                                >

                                    <p style="margin:3px 0;">
                                        <strong>
                                            Creator:
                                        </strong>
                                        ${level.creator || 'N/A'}
                                    </p>

                                    <p style="margin:3px 0;">
                                        <strong>
                                            Value:
                                        </strong>

                                        ${
                                            rank > 150
                                                ? 'LEGACY'
                                                : `${Number(level.points || 0)} PTS`
                                        }
                                    </p>

                                    <p
                                        style="
                                            margin:3px 0;
                                            color:var(--accent);
                                        "
                                    >
                                        <strong>
                                            Role:
                                        </strong>

                                        ${
                                            isVerifier
                                                ? 'Verifier'
                                                : 'Victor'
                                        }
                                    </p>

                                </div>

                            </div>

                        `;


                        grid.appendChild(card);

                    }


                    // ==========================================
                    // CREATED LEVELS
                    // ==========================================

                    if (isCreator) {

                        creationCount++;


                        const card =
                            document.createElement(
                                'div'
                            );

                        card.className =
                            'level-card';


                        card.innerHTML = `

                            <div
                                class="level-card-bg"
                                style="
                                    background-image:url('${imgSource}');
                                "
                            ></div>

                            <div
                                class="level-card-overlay"
                            ></div>

                            <div
                                class="level-info"
                            >

                                <h3
                                    class="level-title"
                                >
                                    #${rank} -
                                    ${level.name}
                                </h3>

                                <div
                                    class="level-meta"
                                >

                                    <p style="margin:3px 0;">
                                        <strong>
                                            Verifier:
                                        </strong>
                                        ${level.verifier || 'N/A'}
                                    </p>

                                    <p style="margin:3px 0;">
                                        <strong>
                                            Value:
                                        </strong>

                                        ${
                                            rank > 150
                                                ? 'LEGACY'
                                                : `${Number(level.points || 0)} PTS`
                                        }
                                    </p>

                                    <p
                                        style="
                                            margin:3px 0;
                                            color:var(--gold);
                                        "
                                    >
                                        <strong>
                                            ID:
                                        </strong>
                                        ${level.id || 'Unknown'}
                                    </p>

                                </div>

                            </div>

                        `;


                        creationsGrid.appendChild(
                            card
                        );

                    }


                    // ==========================================
                    // NON-COMPLETED LEVELS
                    // ==========================================

                    if (
                        !hasBeaten &&
                        !isVerifier
                    ) {

                        unbeatenCount++;


                        const card =
                            document.createElement(
                                'div'
                            );

                        card.className =
                            'level-card unbeaten-card';


                        card.innerHTML = `

                            <div
                                class="level-card-bg"
                                style="
                                    background-image:url('${imgSource}');
                                "
                            ></div>

                            <div
                                class="level-card-overlay"
                            ></div>

                            <div
                                class="level-info"
                            >

                                <h3
                                    class="level-title"
                                    style="color:#aaa;"
                                >
                                    #${rank} -
                                    ${level.name}
                                </h3>

                                <div
                                    class="level-meta"
                                >

                                    <p style="margin:3px 0;">
                                        <strong>
                                            Creator:
                                        </strong>
                                        ${level.creator || 'N/A'}
                                    </p>

                                    <p style="margin:3px 0;">
                                        <strong>
                                            Value:
                                        </strong>

                                        ${
                                            rank > 150
                                                ? 'LEGACY'
                                                : `${Number(level.points || 0)} PTS`
                                        }
                                    </p>

                                    <p style="margin:3px 0;">
                                        <strong>
                                            ID:
                                        </strong>
                                        ${level.id || 'Unknown'}
                                    </p>

                                    <p
                                        style="
                                            margin:3px 0;
                                            color:#666;
                                        "
                                    >
                                        <strong>
                                            Status:
                                        </strong>
                                        Unbeaten
                                    </p>

                                </div>

                            </div>

                        `;


                        unbeatenGrid.appendChild(
                            card
                        );

                    }

                });


                // ==========================================
                // PROCESS PACKS FROM packs.json
                // ==========================================

                let completedPacksCount = 0;


                packs.forEach(pack => {

                    /*
                     * A player completes a pack only when
                     * EVERY level listed in packs.json
                     * has been beaten/verified.
                     */

                    const isCompleted =
                        Array.isArray(pack.levels) &&
                        pack.levels.every(
                            levelName =>
                                beatenLevelNames.includes(
                                    levelName.toLowerCase()
                                )
                        );


                    if (!isCompleted) {
                        return;
                    }


                    completedPacksCount++;


                    /*
                     * Add the pack bonus.
                     *
                     * This is now exactly the same
                     * source used by leaderboard.html.
                     */

                    totalPoints +=
                        Number(pack.points || 0);


                    // ==========================================
                    // PACK THUMBNAIL
                    // ==========================================

                    const firstLvlKey =
                        pack.levels &&
                        pack.levels.length > 0
                            ? pack.levels[0].toLowerCase()
                            : "";


                    const firstLevel =
                        levelMap[firstLvlKey];


                    const packImgSource =
                        firstLevel &&
                        firstLevel.thumbnail
                            ? firstLevel.thumbnail
                            : "";


                    // ==========================================
                    // PACK CARD
                    // ==========================================

                    const card =
                        document.createElement(
                            'div'
                        );

                    card.className =
                        'level-card';


                    card.innerHTML = `

                        <div
                            class="level-card-bg"
                            style="
                                background-image:url('${packImgSource}');
                            "
                        ></div>

                        <div
                            class="level-card-overlay"
                        ></div>

                        <div
                            class="level-info"
                        >

                            <div
                                style="
                                    display:flex;
                                    justify-content:space-between;
                                    align-items:center;
                                    gap:10px;
                                "
                            >

                                <h3
                                    class="level-title"
                                    style="font-size:1.15rem;"
                                >
                                    ${pack.name}
                                </h3>

                                <span
                                    style="
                                        font-size:0.72rem;
                                        font-weight:800;
                                        padding:2px 8px;
                                        border-radius:4px;
                                        background:rgba(255,255,255,0.05);
                                        border:1px solid currentColor;
                                    "
                                    class="tier-${pack.tier}"
                                >
                                    ${pack.tier}
                                </span>

                            </div>


                            <div
                                class="level-meta"
                                style="margin-top:4px;"
                            >

                                <p
                                    style="
                                        margin:3px 0;
                                        color:var(--accent);
                                    "
                                >
                                    <strong>
                                        Bonus:
                                    </strong>

                                    +${Number(pack.points || 0)}
                                    PTS
                                </p>


                                <p
                                    style="
                                        margin:3px 0;
                                        color:#aaa;
                                        font-size:0.8rem;
                                    "
                                >
                                    <strong>
                                        Levels:
                                    </strong>

                                    ${
                                        Array.isArray(pack.levels)
                                            ? pack.levels.join(', ')
                                            : ''
                                    }
                                </p>

                            </div>

                        </div>

                    `;


                    packsGrid.appendChild(
                        card
                    );

                });


                // ==========================================
                // FINAL PLAYER STATS
                // ==========================================

                totalPointsBadge.innerText =
                    `${totalPoints.toLocaleString()} PTS`;


                countBadge.innerText =
                    `${completionCount} ${
                        completionCount === 1
                            ? 'COMPLETION'
                            : 'COMPLETIONS'
                    }`;


                // ==========================================
                // PLAYER TIER
                // ==========================================

                const tierImage =
                    document.getElementById(
                        'playerTierImage'
                    );

                const tierName =
                    document.getElementById(
                        'playerTierName'
                    );

                const tierProgressFill =
                    document.getElementById(
                        'tierProgressFill'
                    );

                const tierProgressCurrent =
                    document.getElementById(
                        'tierProgressCurrent'
                    );

                const tierProgressNext =
                    document.getElementById(
                        'tierProgressNext'
                    );


                /*
                 * Find the tier whose point range
                 * contains the player's total points.
                 */

                let currentTier =
                    playerTiers.find(
                        tier =>
                            totalPoints >=
                            Number(tier.minPoints || 0) &&
                            (
                                tier.maxPoints === null ||
                                totalPoints <=
                                Number(tier.maxPoints)
                            )
                    );


                /*
                 * Safety fallback.
                 */

                if (!currentTier) {

                    currentTier =
                        playerTiers[0];

                }


                // ==========================================
                // PLAYER NAME EFFECT
                // ==========================================

                nameHeading.classList.remove(
                    'tier-bronze',
                    'tier-silver',
                    'tier-gold',
                    'tier-platinum',
                    'tier-diamond',
                    'tier-wave-master'
                );


                const effectClassMap = {

                    "bronze":
                        "tier-bronze",

                    "silver":
                        "tier-silver",

                    "gold":
                        "tier-gold",

                    "platinum":
                        "tier-platinum",

                    "diamond":
                        "tier-diamond",

                    "wave-master-gradient":
                        "tier-wave-master"

                };


                const nameEffect =
                    effectClassMap[
                        currentTier.effect
                    ];


                if (nameEffect) {

                    nameHeading.classList.add(
                        nameEffect
                    );

                } else if (currentTier.color) {

                    nameHeading.style.color =
                        currentTier.color;

                }


                // ==========================================
                // TIER IMAGE
                // ==========================================

                if (currentTier.image) {

                    tierImage.src =
                        currentTier.image;

                }


                tierImage.alt =
                    currentTier.name;


                // ==========================================
                // TIER NAME
                // ==========================================

                tierName.innerText =
                    currentTier.name;


                if (currentTier.color) {

                    tierName.style.color =
                        currentTier.color;

                    tierProgressFill.style.color =
                        currentTier.color;

                    tierProgressFill.style.background =
                        currentTier.color;

                }


                // ==========================================
                // TIER PROGRESSION
                // ==========================================

                const currentMin =
                    Number(
                        currentTier.minPoints || 0
                    );


                const isMaxTier =
                    currentTier.maxPoints === null;


                if (isMaxTier) {

                    /*
                     * Wave Master is the maximum tier.
                     */

                    tierProgressFill.style.width =
                        "100%";


                    tierProgressCurrent.innerText =
                        `${totalPoints.toLocaleString()} PTS`;


                    tierProgressNext.innerText =
                        "MAX TIER • 15,000+ PTS";

                } else {

                    /*
                     * The next tier starts immediately
                     * after the current tier's maximum.
                     */

                    const nextTier =
                        playerTiers.find(
                            tier =>
                                Number(
                                    tier.minPoints || 0
                                ) >
                                currentMin
                        );


                    const nextMin =
                        nextTier
                            ? Number(
                                nextTier.minPoints
                            )
                            : Number(
                                currentTier.maxPoints
                            ) + 1;


                    const pointsIntoTier =
                        Math.max(
                            0,
                            totalPoints -
                            currentMin
                        );


                    const pointsNeeded =
                        Math.max(
                            1,
                            nextMin -
                            currentMin
                        );


                    const progress =
                        Math.min(
                            100,
                            Math.max(
                                0,
                                (
                                    pointsIntoTier /
                                    pointsNeeded
                                ) * 100
                            )
                        );


                    tierProgressFill.style.width =
                        `${progress}%`;


                    tierProgressCurrent.innerText =
                        `${totalPoints.toLocaleString()} / ${nextMin.toLocaleString()} PTS`;


                    tierProgressNext.innerText =
                        nextTier
                            ? `NEXT: ${nextTier.name}`
                            : "MAX TIER";

                }


                // ==========================================
                // HARDEST LEVEL
                // ==========================================

                if (hardestLvl) {

                    hardestBadge.innerText =
                        `HARDEST: #${hardestRank} ` +
                        `${hardestLvl.name.toUpperCase()} ` +
                        `(${Number(hardestLvl.points || 0)} PTS)`;


                    hardestBadge.style.display =
                        "inline-block";


                    if (hardestLvl.thumbnail) {

                        profileBg.style.backgroundImage =
                            `url('${hardestLvl.thumbnail}')`;

                    }

                } else {

                    hardestBadge.style.display =
                        "none";

                }


                // ==========================================
                // EMPTY STATES
                // ==========================================

                if (
                    completedPacksCount === 0
                ) {

                    packsGrid.innerHTML = `

                        <div
                            style="
                                grid-column:1/-1;
                                text-align:center;
                                color:#555;
                                padding:20px;
                            "
                        >
                            No completed level packs
                            found for this player.
                        </div>

                    `;

                }


                if (
                    completionCount === 0
                ) {

                    grid.innerHTML = `

                        <div
                            style="
                                grid-column:1/-1;
                                text-align:center;
                                color:#555;
                                padding:40px;
                            "
                        >
                            No recorded list records
                            found for this player.
                        </div>

                    `;

                }


                if (
                    creationCount === 0
                ) {

                    creationsGrid.innerHTML = `

                        <div
                            style="
                                grid-column:1/-1;
                                text-align:center;
                                color:#555;
                                padding:40px;
                            "
                        >
                            No created levels found
                            on the list for this player.
                        </div>

                    `;

                }


                if (
                    unbeatenCount === 0
                ) {

                    unbeatenGrid.innerHTML = `

                        <div
                            style="
                                grid-column:1/-1;
                                text-align:center;
                                color:var(--gold);
                                padding:40px;
                                font-weight:700;
                            "
                        >
                            100% LIST CLEAR!
                            This player has beaten
                            every level!
                        </div>

                    `;

                }


            } catch (error) {

                console.error(
                    "Player profile loading error:",
                    error
                );


                grid.innerHTML = `

                    <div
                        style="
                            grid-column:1/-1;
                            text-align:center;
                            color:var(--accent);
                            padding:40px;
                        "
                    >
                        Error loading player
                        profile layout data.
                    </div>

                `;

            }

        }


        loadPlayerProfile();

    </script>

</body>
</html>
