<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OPEN VERIFICATIONS | THE WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto !important; }
        .open-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .open-header { text-align: center; margin-bottom: 40px; background: rgba(20, 22, 30, 0.6); padding: 30px; border-radius: 16px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .open-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; }
        .open-card:hover { border-color: #666; }
        .thumb-box { width: 100%; aspect-ratio: 16/9; background: #0a0b0f; overflow: hidden; position: relative; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .open-info { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .open-title { font-size: 1.3rem; font-weight: 700; margin: 0; color: #fff; }
        .open-meta { font-size: 0.85rem; color: #888; }
        .video-btn { display: block; text-align: center; background: rgba(255, 255, 255, 0.1); color: #fff; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; text-decoration: none; margin-top: auto; border: 1px solid rgba(255,255,255,0.1); transition: background 0.2s; }
        .video-btn:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">OPEN VERIFICATIONS</div>
        <a href="index.html" class="nav-link">BACK TO LIST</a>
    </nav>

    <div class="open-container">
        <div class="open-header">
            <h1 style="margin: 0 0 5px 0; font-size: 2rem; font-weight: 800; color: #fff;">OPEN VERIFICATIONS</h1>
            <p style="margin: 0; color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Levels looking for an official verifier</p>
        </div>
        <div id="open-grid" class="grid-layout"></div>
    </div>

    <script>
        // CONFIGURATION: Set your GitHub path here!
        const GITHUB_OWNER = "jokewreb";
        const GITHUB_REPO = "TWL";

        async function loadOpenLevelsFromIssues() {
            const grid = document.getElementById('open-grid');
            try {
                // Fetch open issues from your public GitHub repository repo live
                const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues?state=open&per_page=100`);
                
                if (!response.ok) throw new Error("Could not reach GitHub API");
                const issues = await response.ok ? await response.json() : [];
                
                grid.innerHTML = "";

                // Filter down to only show issues created by your Submit form pipeline
                const filteredSubmissions = issues.filter(issue => issue.title.startsWith("Open Verification Request:"));

                if (filteredSubmissions.length === 0) {
                    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#444; padding:40px;">No open verifications listed at the moment.</div>`;
                    return;
                }

                filteredSubmissions.forEach(issue => {
                    const bodyText = issue.body || "";
                    
                    // 1. Parsing text configurations out of the generated template
                    const nameMatch = bodyText.match(/"name":\s*"(.*?)"/);
                    const creatorMatch = bodyText.match(/"creator":\s*"(.*?)"/);
                    const diffMatch = bodyText.match(/"estimatedDifficulty":\s*"(.*?)"/);
                    const idMatch = bodyText.match(/"id":\s*"(.*?)"/);
                    const videoMatch = bodyText.match(/"video":\s*"(.*?)"/);

                    // 2. SMART EXTRACTION: Finds the raw URL inside the pasted GitHub image src tag
                    const imageSrcMatch = bodyText.match(/src="(https:\/\/github\.com\/user-attachments\/assets\/.*?)"/);

                    const fallbackThumb = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
                    
                    // Assign values if successfully matched out of text blocks, otherwise default back smoothly
                    const lvlName = nameMatch ? nameMatch[1] : issue.title.replace("Open Verification Request:", "").trim();
                    const lvlCreator = creatorMatch ? creatorMatch[1] : "Unknown";
                    const lvlDiff = diffMatch ? diffMatch[1] : "Unrated";
                    const lvlId = idMatch ? idMatch[1] : "N/A";
                    const lvlVideo = videoMatch ? videoMatch[1] : "";
                    const imgSource = imageSrcMatch ? imageSrcMatch[1] : fallbackThumb;

                    let actionButtonHTML = "";
                    if (lvlVideo && lvlVideo.trim() !== "") {
                        actionButtonHTML = `<a href="${lvlVideo}" target="_blank" class="video-btn">View Showcase</a>`;
                    }

                    grid.innerHTML += `
                        <div class="open-card">
                            <div class="thumb-box">
                                <img src="${imgSource}" class="thumb-img" onerror="this.src='${fallbackThumb}'">
                            </div>
                            <div class="open-info">
                                <h3 class="open-title">${lvlName}</h3>
                                <div class="open-meta">
                                    <p style="margin: 4px 0;"><strong>Creator:</strong> ${lvlCreator}</p>
                                    <p style="margin: 4px 0;"><strong>Estimated Difficulty:</strong> <span style="color: #aaa; font-weight:700;">${lvlDiff}</span></p>
                                    <p style="margin: 4px 0;"><strong>Level ID:</strong> <span style="color:var(--gold);">${lvlId}</span></p>
                                </div>
                                ${actionButtonHTML}
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error(e);
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--accent); padding:40px;">Error loading data configurations directly from live tracker.</div>`;
            }
        }
        
        loadOpenLevelsFromIssues();
    </script>
</body>
</html>
