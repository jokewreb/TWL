<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OPEN VERIFICATIONS | THE WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto !important; background: #0a0b10; color: #fff; font-family: sans-serif; }
        .open-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .open-header { text-align: center; margin-bottom: 40px; background: rgba(20, 22, 30, 0.6); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .open-card { background: #14161e; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; }
        .open-card:hover { border-color: #47e5bc; }
        .thumb-box { width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; position: relative; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .open-info { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .open-title { font-size: 1.3rem; font-weight: 700; margin: 0; color: #fff; text-transform: uppercase; }
        .open-meta { font-size: 0.85rem; color: #aaa; }
        .video-btn { display: block; text-align: center; background: rgba(255, 255, 255, 0.1); color: #fff; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; text-decoration: none; margin-top: auto; border: 1px solid rgba(255,255,255,0.1); transition: background 0.2s; }
        .video-btn:hover { background: #47e5bc; color: #000; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo" style="padding: 20px; font-weight: 800; letter-spacing: 1px;">OPEN VERIFICATIONS</div>
    </nav>

    <div class="open-container">
        <div class="open-header">
            <h1 style="margin: 0 0 5px 0; font-size: 2rem; font-weight: 800; color: #fff;">OPEN VERIFICATIONS</h1>
            <p style="margin: 0; color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Levels looking for an official verifier</p>
        </div>
        <div id="open-grid" class="grid-layout"></div>
    </div>

    <script>
        // CHANGE THESE TO YOUR GITHUB PROFILE AND REPOSITORY NAME
        const GITHUB_OWNER = "jokewreb";
        const GITHUB_REPO = "TWL";

        async function loadOpenLevelsFromIssues() {
            const grid = document.getElementById('open-grid');
            try {
                // Fetch issues from repository tracker live
                const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues?state=open&per_page=100`);
                if (!response.ok) throw new Error("API Limit reached or private repo issue.");
                
                const issues = await response.json();
                grid.innerHTML = "";

                // Look for issues created via form layout titles or text matching parameters
                const filteredSubmissions = issues.filter(issue => 
                    issue.title.startsWith("Open Verification Request:") || 
                    issue.body.includes("NAME:")
                );

                if (filteredSubmissions.length === 0) {
                    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#666; padding:40px;">No open verifications listed at the moment.</div>`;
                    return;
                }

                filteredSubmissions.forEach(issue => {
                    const bodyText = issue.body || "";
                    const fallbackThumb = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

                    // Initialize standard placeholders
                    let lvlName = issue.title.replace("Open Verification Request:", "").trim();
                    let lvlCreator = "Unknown";
                    let lvlDiff = "Unrated";
                    let lvlId = "N/A";
                    let lvlVideo = "";
                    let imgSource = fallbackThumb;

                    // Parse text layout configurations dynamically
                    const nameMatch = bodyText.match(/(?:NAME|name)[:=]\s*(.*?)(?:\r|\n|$)/i);
                    const creatorMatch = bodyText.match(/(?:CREATOR|creator)[:=]\s*(.*?)(?:\r|\n|$)/i);
                    const diffMatch = bodyText.match(/(?:DIFFICULTY|estimatedDifficulty)[:=]\s*(.*?)(?:\r|\n|$)/i);
                    const idMatch = bodyText.match(/(?:ID|id)[:=]\s*(.*?)(?:\r|\n|$)/i);
                    const videoMatch = bodyText.match(/(?:YOUTUBE VIDEO|VIDEO|video)[:=]\s*(https?:\/\/[^\s]+)/i);

                    if (nameMatch) lvlName = nameMatch[1].replace(/["\`,]/g, "").trim();
                    if (creatorMatch) lvlCreator = creatorMatch[1].replace(/["\`,]/g, "").trim();
                    if (diffMatch) lvlDiff = diffMatch[1].replace(/["\`,]/g, "").trim();
                    if (idMatch) lvlId = idMatch[1].replace(/["\`,]/g, "").trim();
                    if (videoMatch) lvlVideo = videoMatch[1].replace(/["\`,]/g, "").trim();

                    // Universal regex logic to pull image assets out of any HTML tags or raw text markdown pastes
                    const htmlImgMatch = bodyText.match(/src=["'](https:\/\/github\.com\/user-attachments\/assets\/[^"']+)["']/);
                    const mdImgMatch = bodyText.match(/!\[.*?\]\((https:\/\/github\.com\/user-attachments\/assets\/.*?)\)/);
                    const rawUrlMatch = bodyText.match(/(https:\/\/github\.com\/user-attachments\/assets\/[^\s\)\"\'\`\>]+)/);

                    if (htmlImgMatch) imgSource = htmlImgMatch[1];
                    else if (mdImgMatch) imgSource = mdImgMatch[1];
                    else if (rawUrlMatch) imgSource = rawUrlMatch[1];

                    let actionButtonHTML = "";
                    if (lvlVideo) {
                        actionButtonHTML = `<a href="${lvlVideo}" target="_blank" class="video-btn">View Showcase</a>`;
                    }

                    grid.innerHTML += `
                        <div class="open-card">
                            <div class="thumb-box">
                                <img src="${imgSource}" class="thumb-img" onerror="this.src='${fallbackThumb}'">
                            </div>
                            <div class="open-info">
                                <h3 class="open-title">${lvlName}</h3>
                                <div class="open-meta">
                                    <p style="margin: 4px 0;"><strong>Creator:</strong> ${lvlCreator}</p>
                                    <p style="margin: 4px 0;"><strong>Estimated Difficulty:</strong> <span style="color: #47e5bc; font-weight:700;">${lvlDiff}</span></p>
                                    <p style="margin: 4px 0;"><strong>Level ID:</strong> <span style="color:#ffd700;">${lvlId}</span></p>
                                </div>
                                ${actionButtonHTML}
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error(e);
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#ff4a4a; padding:40px;">Error syncing data with your GitHub Repository list loop.</div>`;
            }
        }
        loadOpenLevelsFromIssues();
    </script>
</body>
</html>
