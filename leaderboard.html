<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LEADERBOARD | WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto; }
        #canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }
        .lb-container { max-width: 950px; margin: 60px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        
        tr { 
            position: relative;
            background: rgba(20, 22, 30, 0.85); 
            backdrop-filter: blur(10px); 
            transition: transform 0.3s ease, border-color 0.3s ease;
            overflow: hidden;
            border-radius: 8px;
        }
        tr:hover { transform: scale(1.02); }

        /* Hardest Level Background Overlay */
        .tr-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        tr:hover .tr-bg {
            opacity: 0.3;
        }

        td { 
            position: relative;
            z-index: 1;
            padding: 18px 20px; 
            border-top: 1px solid var(--border); 
            border-bottom: 1px solid var(--border); 
        }
        td:first-child { border-radius: 8px 0 0 8px; border-left: 1px solid var(--border); width: 80px; text-align: center; font-weight: 700; }
        td:last-child { border-radius: 0 8px 8px 0; border-right: 1px solid var(--border); text-align: right; color: var(--accent); font-weight: 700; }
        
        .gold { color: var(--gold, #ffd700); } 
        .silver { color: var(--silver, #c0c0c0); } 
        .bronze { color: var(--bronze, #cd7f32); }

        .hardest-tag {
            font-size: 0.8rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <nav>
        <div class="nav-logo">LEADERBOARD</div>
        <a href="index.html" class="nav-link">BACK TO LIST</a>
    </nav>
    <div class="lb-container">
        <table><tbody id="lb-data"></tbody></table>
    </div>

    <script>
        const PACKS_DATA = [
            {
                name: "Wave Corridor Pack",
                tier: "PLATINUM",
                points: 100,
                levels: [
                    "Unnerfed Wave Corridor",
                    "Silent Wave Corridor Infinity Unleashed XYZ",
                    "Old Wave Corridor",
                    "Wave Corridor",
                    "Nerfed Wave Corridor"
                ]
            },
            {
                name: "Top 1 Pack I",
                tier: "PLATINUM",
                points: 100,
                levels: [
                    "Unnerfed Wave Corridor",
                    "ULTIMATE DIHRUCTION",
                    "Tung After Tung"
                ]
            },
            {
                name: "Top 1 Pack II",
                tier: "DIAMOND",
                points: 200,
                levels: [
                    "Zirconium Shard",
                    "SYMM NO SCLEARS",
                    "Defeated Brajan"
                ]
            },
            {
                name: "Defeated Pack",
                tier: "DIAMOND",
                points: 200,
                levels: [
                    "Defeated Brajan",
                    "The Brajan Dih",
                    "defeated ez nerf",
                    "Beefeated Brajan"
                ]
            },
            {
                name: "Radioactive Trilogy",
                tier: "PLATINUM",
                points: 100,
                levels: [
                    "NEPTUNIUM",
                    "URANIUM",
                    "PLUTONIUM"
                ]
            },
            {
                name: "Bottom 1 Pack I",
                tier: "BRONZE",
                points: 25,
                levels: [
                    "Zoink WAVE",
                    "Swag Clubstep",
                    "Sakupen Hellcles"
                ]
            },
            {
                name: "ChefLimeWaveBasic Pack",
                tier: "SILVER",
                points: 50,
                levels: [
                    "ChefLimeWaveBasic4",
                    "ChefLimeWaveBasic3",
                    "ChefLimeWaveBasic5",
                    "ChefLimeWaveBasic1",
                    "ChefLimeWaveBasic2",
                    "ChefLimeWaveBasic FINALE"
                ]
            },
            {
                name: "TooSquared and Friends",
                tier: "DIAMOND",
                points: 200,
                levels: [
                    "TooCub3d",
                    "TooSquared",
                    "3Squared"
                ]
            }
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let parts = [];
        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            parts = []; for(let i=0; i<100; i++) parts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2, sp: Math.random()*0.5+0.1});
        }
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            parts.forEach(p => { ctx.fillStyle = "rgba(255,65,65,0.3)"; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill(); p.y -= p.sp; if(p.y<0) p.y=canvas.height; });
            requestAnimationFrame(anim);
        }
        window.onresize = initCanvas; initCanvas(); anim();

        async function load() {
            const res = await fetch(`levels.json?v=${new Date().getTime()}`);
            const data = await res.json();
            const scores = {};
            const playerLevels = {};
            const playerHardest = {}; // Stores hardest level object per player
            const clean = (n) => n.replace(/\./g, '').trim();

            data.sort((a, b) => b.points - a.points);

            data.forEach((l, index) => {
                const rank = index + 1;
                const pointsToAward = rank > 150 ? 0 : l.points;

                const addPlayerRecord = (playerName, levelObj) => {
                    if (!playerLevels[playerName]) playerLevels[playerName] = new Set();
                    playerLevels[playerName].add(levelObj.name.toLowerCase());

                    // Tracks highest point level as player's hardest
                    if (!playerHardest[playerName] || levelObj.points > playerHardest[playerName].points) {
                        playerHardest[playerName] = levelObj;
                    }
                };

                if (l.verifier) {
                    const v = clean(l.verifier);
                    scores[v] = (scores[v] || 0) + pointsToAward;
                    addPlayerRecord(v, l);
                }

                if (l.victors && Array.isArray(l.victors)) {
                    l.victors.forEach(vic => { 
                        const vn = clean(vic); 
                        scores[vn] = (scores[vn] || 0) + pointsToAward; 
                        addPlayerRecord(vn, l);
                    });
                }
            });

            Object.keys(playerLevels).forEach(player => {
                const completed = playerLevels[player];
                PACKS_DATA.forEach(pack => {
                    const isCompleted = pack.levels.every(lvl => completed.has(lvl.toLowerCase()));
                    if (isCompleted) {
                        scores[player] = (scores[player] || 0) + pack.points;
                    }
                });
            });

            const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
            const table = document.getElementById('lb-data');
            
            sorted.forEach(([name, pts], i) => {
                const r = i+1;
                const c = r==1?'gold':r==2?'silver':r==3?'bronze':'';
                
                const hardest = playerHardest[name];
                const bgThumb = hardest && hardest.thumbnail ? hardest.thumbnail : '';
                const hardestName = hardest ? hardest.name : '-';
                
                table.innerHTML += `
                    <tr>
                        ${bgThumb ? `<div class="tr-bg" style="background-image: url('${bgThumb}');"></div>` : ''}
                        <td class="${c}">#${r}</td>
                        <td>
                            <a href="player.html?name=${encodeURIComponent(name)}" class="player-link" style="text-decoration: none; font-weight: 700; font-size: 1.05rem;">
                                ${name}
                            </a>
                        </td>
                        <td class="hardest-tag">
                            <span style="opacity:0.6;">Hardest:</span> 
                            <strong style="color: #fff;">${hardestName}</strong>
                        </td>
                        <td>${pts.toLocaleString()} PTS</td>
                    </tr>
                `;
            });
        }
        load();
    </script>
</body>
</html>
