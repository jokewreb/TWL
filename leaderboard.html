<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LEADERBOARD | WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            overflow-y: auto; 
            background-color: #0b0c10; 
            margin: 0; 
            padding-bottom: 50px; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        /* Particle Background Canvas */
        #canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 0; 
            pointer-events: none; 
        }

        .lb-container { 
            position: relative; 
            z-index: 1; 
            width: 92%;
            max-width: 1350px; 
            margin: 40px auto; 
            padding: 0 10px; 
        }

        /* Top 3 Podium Cards */
        .podium-container {
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 35px;
        }

        .pod-card {
            position: relative;
            flex: 1;
            max-width: 400px;
            background: rgba(20, 22, 30, 0.85);
            border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
            border-radius: 12px;
            padding: 22px 18px;
            text-align: center;
            backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .pod-card:hover { transform: translateY(-4px); }

        .pod-card.rank-1 {
            order: 2;
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
            padding-top: 28px;
        }
        .pod-card.rank-2 { order: 1; border-color: #c0c0c0; }
        .pod-card.rank-3 { order: 3; border-color: #cd7f32; }

        .pod-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
        }

        .pod-content { position: relative; z-index: 1; }
        .crown-icon { font-size: 1.8rem; margin-bottom: 5px; display: block; }

        .pod-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            text-decoration: none;
            display: block;
        }

        .pod-pts {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--accent, #ff4141);
            margin-bottom: 8px;
        }

        .pod-stats {
            font-size: 0.8rem;
            color: #888;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        /* Leaderboard Table */
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0 10px; 
            table-layout: fixed;
        }
        
        tr { 
            background-color: rgba(20, 22, 30, 0.85); 
            backdrop-filter: blur(10px); 
            transition: transform 0.2s ease, background-color 0.2s ease;
            height: 62px;
            cursor: pointer; /* Pointer cursor for interactive row */
        }
        tr:hover { 
            transform: scale(1.005); 
            filter: brightness(1.15);
        }

        td { 
            padding: 0 20px; 
            height: 62px;
            vertical-align: middle;
            border-top: 1px solid var(--border, rgba(255,255,255,0.08)); 
            border-bottom: 1px solid var(--border, rgba(255,255,255,0.08)); 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: transparent;
        }
        
        /* Rank Number Column */
        td:first-child { 
            border-radius: 8px 0 0 8px; 
            border-left: 1px solid var(--border, rgba(255,255,255,0.08)); 
            width: 80px; 
            padding: 0 10px;
            text-align: center; 
            font-weight: 800; 
            font-size: 1rem;
            color: #fff;
        }

        td.col-player { width: 35%; }
        
        td.col-pts { 
            width: 25%;
            text-align: center; 
            color: var(--accent, #ff4141); 
            font-weight: 800; 
            font-size: 1.05rem;
        }

        td.col-hardest { 
            border-radius: 0 8px 8px 0; 
            border-right: 1px solid var(--border, rgba(255,255,255,0.08)); 
            text-align: right; 
            font-size: 0.9rem;
            color: #aaa;
            padding-right: 24px;
        }

        .player-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .player-title { 
            font-weight: 700; 
            color: #fff; 
            font-size: 1rem; 
            text-decoration: none; 
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sub-stat { font-size: 0.75rem; color: #777; margin-top: 2px; }

        /* Dynamic Tier Colors */
        .tier-ruby { color: #ff3355 !important; }
        .tier-diamond { color: #00d2ff !important; }
        .tier-platinum { color: #e5e4e2 !important; }
        .tier-gold { color: #ffd700 !important; }
        .tier-silver { color: #c0c0c0 !important; }
        .tier-bronze { color: #cd7f32 !important; }
        .tier-default { color: #ffffff !important; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <nav style="position: relative; z-index: 1;">
        <div class="nav-logo">LEADERBOARD</div>
        <a href="index.html" class="nav-link">BACK TO LIST</a>
    </nav>

    <div class="lb-container">
        <!-- Top 3 Podium Cards -->
        <div class="podium-container" id="podium-data"></div>

        <!-- Remaining Leaderboard Ranks -->
        <table>
            <tbody id="lb-data"></tbody>
        </table>
    </div>

    <script>
        const PACKS_DATA = [
            {
                name: "Wave Corridor Pack",
                tier: "PLATINUM",
                points: 100,
                levels: ["Unnerfed Wave Corridor", "Silent Wave Corridor Infinity Unleashed XYZ", "Old Wave Corridor", "Wave Corridor", "Nerfed Wave Corridor"]
            },
            {
                name: "Top 1 Pack I",
                tier: "PLATINUM",
                points: 100,
                levels: ["Unnerfed Wave Corridor", "ULTIMATE DIHRUCTION", "Tung After Tung"]
            },
            {
                name: "Top 1 Pack II",
                tier: "DIAMOND",
                points: 200,
                levels: ["Zirconium Shard", "SYMM NO SCLEARS", "Defeated Brajan"]
            },
            {
                name: "Defeated Pack",
                tier: "DIAMOND",
                points: 200,
                levels: ["Defeated Brajan", "The Brajan Dih", "defeated ez nerf", "Beefeated Brajan"]
            },
            {
                name: "Radioactive Trilogy",
                tier: "PLATINUM",
                points: 100,
                levels: ["NEPTUNIUM", "URANIUM", "PLUTONIUM"]
            },
            {
                name: "Bottom 1 Pack I",
                tier: "BRONZE",
                points: 25,
                levels: ["Zoink WAVE", "Swag Clubstep", "Sakupen Hellcles"]
            },
            {
                name: "ChefLimeWaveBasic Pack",
                tier: "SILVER",
                points: 50,
                levels: ["ChefLimeWaveBasic4", "ChefLimeWaveBasic3", "ChefLimeWaveBasic5", "ChefLimeWaveBasic1", "ChefLimeWaveBasic2", "ChefLimeWaveBasic FINALE"]
            },
            {
                name: "TooSquared and Friends",
                tier: "DIAMOND",
                points: 200,
                levels: ["TooCub3d", "TooSquared", "3Squared"]
            }
        ];

        // Background Particle Effect
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let parts = [];
        function initCanvas() {
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight;
            parts = []; 
            for(let i=0; i<80; i++) {
                parts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2, sp: Math.random()*0.4+0.1});
            }
        }
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            parts.forEach(p => { 
                ctx.fillStyle = "rgba(255,65,65,0.25)"; 
                ctx.beginPath(); 
                ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); 
                ctx.fill(); 
                p.y -= p.sp; 
                if(p.y<0) p.y=canvas.height; 
            });
            requestAnimationFrame(anim);
        }
        window.onresize = initCanvas; initCanvas(); anim();

        // Tier Color Helper
        function getTierClass(tier) {
            if (!tier) return 'tier-default';
            const t = tier.toLowerCase();
            if (t.includes('ruby')) return 'tier-ruby';
            if (t.includes('diamond')) return 'tier-diamond';
            if (t.includes('platinum')) return 'tier-platinum';
            if (t.includes('gold')) return 'tier-gold';
            if (t.includes('silver')) return 'tier-silver';
            if (t.includes('bronze')) return 'tier-bronze';
            return 'tier-default';
        }

        async function load() {
            const res = await fetch(`levels.json?v=${new Date().getTime()}`);
            const data = await res.json();
            const scores = {};
            const playerLevels = {};
            const playerHardest = {};
            const clean = (n) => n.replace(/\./g, '').trim();

            data.sort((a, b) => b.points - a.points);

            data.forEach((l, index) => {
                const rank = index + 1;
                const pointsToAward = rank > 150 ? 0 : l.points;

                const addPlayerRecord = (playerName, levelObj) => {
                    if (!playerLevels[playerName]) playerLevels[playerName] = new Set();
                    playerLevels[playerName].add(levelObj.name.toLowerCase());

                    if (!playerHardest[playerName] || levelObj.points > playerHardest[playerName].points) {
                        playerHardest[playerName] = levelObj;
                    }
                };

                if (l.verifier) {
                    const v = clean(l.verifier);
                    scores[v] = (scores[v] || 0) + pointsToAward;
                    addPlayerRecord(v, l);
                }

                if (l.victors && Array.isArray(l.victors)) {
                    l.victors.forEach(vic => { 
                        const vn = clean(vic); 
                        scores[vn] = (scores[vn] || 0) + pointsToAward; 
                        addPlayerRecord(vn, l);
                    });
                }
            });

            Object.keys(playerLevels).forEach(player => {
                const completed = playerLevels[player];
                PACKS_DATA.forEach(pack => {
                    const isCompleted = pack.levels.every(lvl => completed.has(lvl.toLowerCase()));
                    if (isCompleted) {
                        scores[player] = (scores[player] || 0) + pack.points;
                    }
                });
            });

            const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
            
            // Top 3 Podium Cards
            const podiumContainer = document.getElementById('podium-data');
            const top3 = sorted.slice(0, 3);
            let podiumHTML = "";

            top3.forEach(([name, pts], index) => {
                const rank = index + 1;
                const hardest = playerHardest[name];
                const bgThumb = hardest && hardest.thumbnail ? hardest.thumbnail : '';
                const hardestName = hardest ? hardest.name : '-';
                const hardestClass = hardest ? getTierClass(hardest.tier) : 'tier-default';
                const compCount = playerLevels[name] ? playerLevels[name].size : 0;
                const crown = rank === 1 ? '👑' : rank === 2 ? '🥈' : '🥉';

                podiumHTML += `
                    <div class="pod-card rank-${rank}">
                        ${bgThumb ? `<div class="pod-bg" style="background-image: url('${bgThumb}');"></div>` : ''}
                        <div class="pod-content">
                            <span class="crown-icon">${crown}</span>
                            <a href="player.html?name=${encodeURIComponent(name)}" class="pod-name">${name}</a>
                            <div class="pod-pts">${pts.toLocaleString()} PTS</div>
                            <div class="pod-stats">
                                <span><strong>${compCount}</strong> completed</span>
                                <span>Hardest: <strong class="${hardestClass}">${hardestName}</strong></span>
                            </div>
                        </div>
                    </div>
                `;
            });
            podiumContainer.innerHTML = podiumHTML;

            // Ranks #4+
            const table = document.getElementById('lb-data');
            const remaining = sorted.slice(3);

            remaining.forEach(([name, pts], i) => {
                const r = i + 4;
                const hardest = playerHardest[name];
                const bgThumb = hardest && hardest.thumbnail ? hardest.thumbnail : '';
                const hardestName = hardest ? hardest.name : '-';
                const hardestClass = hardest ? getTierClass(hardest.tier) : 'tier-default';
                const compCount = playerLevels[name] ? playerLevels[name].size : 0;
                const profileUrl = `player.html?name=${encodeURIComponent(name)}`;

                const bgStyle = bgThumb 
                    ? `background: linear-gradient(90deg, rgba(20,22,30,0.92) 0%, rgba(20,22,30,0.8) 100%), url('${bgThumb}'); background-size: cover; background-position: center;`
                    : '';

                table.innerHTML += `
                    <tr style="${bgStyle}" onclick="window.location.href='${profileUrl}'">
                        <td>#${r}</td>
                        <td class="col-player">
                            <div class="player-wrapper">
                                <span class="player-title">${name}</span>
                                <div class="sub-stat">${compCount} completed</div>
                            </div>
                        </td>
                        <td class="col-pts">${pts.toLocaleString()} PTS</td>
                        <td class="col-hardest">
                            <span style="opacity:0.5;">Hardest:</span> 
                            <strong class="${hardestClass}">${hardestName}</strong>
                        </td>
                    </tr>
                `;
            });
        }
        load();
    </script>
</body>
</html>
