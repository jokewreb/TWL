<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LEADERBOARD | WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto; }
        #canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }
        .lb-container { max-width: 800px; margin: 60px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        tr { background: rgba(20, 22, 30, 0.8); backdrop-filter: blur(10px); transition: 0.3s; }
        tr:hover { transform: scale(1.02); border-color: var(--accent); }
        td { padding: 20px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        td:first-child { border-radius: 8px 0 0 8px; border-left: 1px solid var(--border); width: 80px; text-align: center; font-weight: 700; }
        td:last-child { border-radius: 0 8px 8px 0; border-right: 1px solid var(--border); text-align: right; color: var(--accent); font-weight: 700; }
        .gold { color: var(--gold); } .silver { color: var(--silver); } .bronze { color: var(--bronze); }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <nav>
        <div class="nav-logo">LEADERBOARD</div>
        <a href="index.html" class="nav-link">BACK TO LIST</a>
    </nav>
    <div class="lb-container">
        <table><tbody id="lb-data"></tbody></table>
    </div>

    <script>
        const PACKS_DATA = [
            {
                name: "Wave Corridor Pack",
                tier: "PLATINUM",
                points: 100,
                levels: [
                    "Unnerfed Wave Corridor",
                    "Silent Wave Corridor Infinity Unleashed XYZ",
                    "Old Wave Corridor",
                    "Wave Corridor",
                    "Nerfed Wave Corridor"
                ]
            },
            {
                name: "Top 1 Pack I",
                tier: "PLATINUM",
                points: 100,
                levels: [
                    "Unnerfed Wave Corridor",
                    "ULTIMATE DIHRUCTION",
                    "Tung After Tung"
                ]
            },
            {
                name: "Top 1 Pack II",
                tier: "DIAMOND",
                points: 200,
                levels: [
                    "Zirconium Shard",
                    "SYMM NO SCLEARS",
                    "Defeated Brajan"
                ]
            },
            {
                name: "Defeated Pack",
                tier: "DIAMOND",
                points: 200,
                levels: [
                    "Defeated Brajan",
                    "The Brajan Dih",
                    "defeated ez nerf",
                    "Beefeated Brajan"
                ]
            },
            {
                name: "Radioactive Trilogy",
                tier: "PLATINUM",
                points: 100,
                levels: [
                    "NEPTUNIUM",
                    "URANIUM",
                    "PLUTONIUM"
                ]
            },
            {
                name: "Bottom 1 Pack I",
                tier: "BRONZE",
                points: 25,
                levels: [
                    "Zoink WAVE",
                    "Swag Clubstep",
                    "Sakupen Hellcles"
                ]
            },
            {
                name: "ChefLimeWaveBasic Pack",
                tier: "SILVER",
                points: 50,
                levels: [
                    "ChefLimeWaveBasic4",
                    "ChefLimeWaveBasic3",
                    "ChefLimeWaveBasic5",
                    "ChefLimeWaveBasic1",
                    "ChefLimeWaveBasic2",
                    "ChefLimeWaveBasic FINALE"
                ]
            },
            {
                name: "TooSquared and Friends",
                tier: "DIAMOND",
                points: 200,
                levels: [
                    "TooCub3d",
                    "TooSquared",
                    "3Squared"
                ]
            }
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let parts = [];
        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            parts = []; for(let i=0; i<100; i++) parts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2, sp: Math.random()*0.5+0.1});
        }
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            parts.forEach(p => { ctx.fillStyle = "rgba(255,65,65,0.3)"; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill(); p.y -= p.sp; if(p.y<0) p.y=canvas.height; });
            requestAnimationFrame(anim);
        }
        window.onresize = initCanvas; initCanvas(); anim();

        async function load() {
            const res = await fetch(`levels.json?v=${new Date().getTime()}`);
            const data = await res.json();
            const scores = {};
            const playerLevels = {};
            const clean = (n) => n.replace(/\./g, '').trim();

            data.sort((a, b) => b.points - a.points);

            data.forEach((l, index) => {
                const rank = index + 1;
                const pointsToAward = rank > 150 ? 0 : l.points;

                const addPlayerLevel = (playerName, levelName) => {
                    if (!playerLevels[playerName]) playerLevels[playerName] = new Set();
                    playerLevels[playerName].add(levelName.toLowerCase());
                };

                if (l.verifier) {
                    const v = clean(l.verifier);
                    scores[v] = (scores[v] || 0) + pointsToAward;
                    addPlayerLevel(v, l.name);
                }

                if (l.victors && Array.isArray(l.victors)) {
                    l.victors.forEach(vic => { 
                        const vn = clean(vic); 
                        scores[vn] = (scores[vn] || 0) + pointsToAward; 
                        addPlayerLevel(vn, l.name);
                    });
                }
            });

            Object.keys(playerLevels).forEach(player => {
                const completed = playerLevels[player];
                PACKS_DATA.forEach(pack => {
                    const isCompleted = pack.levels.every(lvl => completed.has(lvl.toLowerCase()));
                    if (isCompleted) {
                        scores[player] = (scores[player] || 0) + pack.points;
                    }
                });
            });

            const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
            const table = document.getElementById('lb-data');
            sorted.forEach(([name, pts], i) => {
                const r = i+1;
                const c = r==1?'gold':r==2?'silver':r==3?'bronze':'';
                
                table.innerHTML += `
                    <tr>
                        <td class="${c}">#${r}</td>
                        <td>
                            <a href="player.html?name=${encodeURIComponent(name)}" class="player-link" style="text-decoration: none;">
                                ${name}
                            </a>
                        </td>
                        <td>${pts.toLocaleString()} PTS</td>
                    </tr>
                `;
            });
        }
        load();
    </script>
</body>
</html>
