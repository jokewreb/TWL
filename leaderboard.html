<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LEADERBOARD | WAVE LIST</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lb-container { max-width: 800px; margin: 40px auto; width: 90%; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        tr { background: var(--card); }
        td { padding: 15px 25px; border: 1px solid var(--border); }
        td:first-child { border-radius: 6px 0 0 6px; font-weight: 700; width: 50px; text-align: center; }
        td:last-child { border-radius: 0 6px 6px 0; text-align: right; color: var(--accent); font-weight: 700; }
        .gold { color: var(--gold); text-shadow: 0 0 10px rgba(255,207,75,0.3); }
        .silver { color: var(--silver); }
        .bronze { color: var(--bronze); }
    </style>
</head>
<body style="overflow: auto;">
    <nav>
        <div class="nav-logo">LEADERBOARD</div>
        <a href="index.html" class="nav-link">BACK TO LIST</a>
    </nav>
    <div class="lb-container">
        <table><tbody id="lb-data"></tbody></table>
    </div>

    <script>
        async function load() {
            const res = await fetch('./levels.json');
            const data = await res.json();
            const scores = {};
            data.forEach(l => {
                scores[l.verifier] = (scores[l.verifier] || 0) + l.points;
                l.victors.forEach(v => { scores[v] = (scores[v] || 0) + l.points; });
            });
            const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
            const table = document.getElementById('lb-data');
            sorted.forEach(([name, pts], i) => {
                const r = i+1;
                const rClass = r==1?'gold':r==2?'silver':r==3?'bronze':'';
                table.innerHTML += `<tr style="transform: scale(1); transition: 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                    <td class="${rClass}">#${r}</td>
                    <td>${name}</td>
                    <td>${pts.toLocaleString()} PTS</td>
                </tr>`;
            });
        }
        load();
    </script>
</body>
</html>
