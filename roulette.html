<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette - THE WAVE LIST</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
        }

        .page-wrapper {
            width: 100%;
            padding: 10px 40px 40px;
        }

        .roulette-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-top-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .progress-banner {
            font-size: clamp(2rem, 4vw, 4rem);
            font-weight: 900;
            line-height: 1;
        }

        .target-sub {
            font-size: clamp(0.65rem, 1vw, 0.9rem);
            white-space: nowrap;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            margin-bottom: 20px;
        }

        .roulette-card {
            width: 100%;
            padding: 45px 55px;
            border-radius: 20px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 45px;
            align-items: center;
        }

        .media-col {
            width: 100%;
            min-width: 0;
        }

        .roulette-thumb {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
        }

        .info-col {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .level-name {
            font-size: clamp(2rem, 4vw, 4rem);
            line-height: 1.05;
            overflow-wrap: anywhere;
        }

        .details-grid {
            width: 100%;
            min-width: 0;
        }

        .btn-group {
            width: 100%;
            display: flex;
            gap: 12px;
        }

        .roulette-btn {
            min-width: 0;
            flex: 1;
        }

        .win-screen {
            width: 100%;
            text-align: center;
        }


        /* TABLET */
        @media (max-width: 1100px) {

            .page-wrapper {
                padding: 10px 20px 30px;
            }

            .roulette-card {
                padding: 30px;
            }

            .card-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .roulette-thumb {
                max-height: 45vh;
            }

            .level-name {
                font-size: clamp(2rem, 6vw, 3.5rem);
            }
        }


        /* PHONE */
        @media (max-width: 600px) {

            nav {
                padding: 10px 12px;
                gap: 8px;
            }

            nav .nav-logo {
                font-size: 0.85rem;
                letter-spacing: 1px;
                white-space: nowrap;
            }

            nav .nav-link {
                font-size: 0.62rem;
                padding: 4px 5px;
                letter-spacing: 0.5px;
            }

            .page-wrapper {
                padding: 8px;
            }

            .roulette-container {
                width: 100%;
            }

            .header-top-line {
                align-items: flex-start;
                gap: 8px;
            }

            .progress-banner {
                font-size: 2rem;
                letter-spacing: -1px;
            }

            .target-sub {
                font-size: 0.6rem;
                padding: 7px 9px;
                letter-spacing: 0.8px;
            }

            .progress-bar-bg {
                height: 8px;
                margin-bottom: 12px;
            }

            .roulette-card {
                padding: 12px;
                border-radius: 14px;
            }

            .card-grid {
                gap: 16px;
            }

            .roulette-thumb {
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
                max-height: none;
                border-radius: 10px;
            }

            .level-name {
                font-size: 1.8rem;
                line-height: 1.1;
            }

            .details-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                padding: 12px;
            }

            .detail-label {
                font-size: 0.6rem;
            }

            .detail-value {
                font-size: 0.85rem;
            }

            .btn-group {
                gap: 8px;
            }

            .roulette-btn {
                padding: 12px 8px;
                font-size: 0.75rem;
            }
        }


        /* VERY SMALL PHONES */
        @media (max-width: 380px) {

            nav {
                padding-left: 8px;
                padding-right: 8px;
            }

            nav .nav-logo {
                font-size: 0.72rem;
            }

            nav .nav-link {
                font-size: 0.55rem;
                padding-left: 3px;
                padding-right: 3px;
            }

            .page-wrapper {
                padding: 6px;
            }

            .progress-banner {
                font-size: 1.65rem;
            }

            .target-sub {
                font-size: 0.52rem;
                padding: 6px 7px;
            }

            .roulette-card {
                padding: 10px;
            }

            .level-name {
                font-size: 1.5rem;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .roulette-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="nav-logo">THE WAVE LIST</div>

    <div class="nav-links">
        <a href="index.html" class="nav-link">LIST</a>
        <a href="leaderboard.html" class="nav-link">LEADERBOARD</a>
        <a href="legacy.html" class="nav-link">LEGACY</a>
        <a href="roulette.html" class="nav-link active">ROULETTE</a>
    </div>
</nav>


<div class="page-wrapper">

    <div class="roulette-container">

        <div class="header-top-line">
            <div class="progress-banner" id="progress-banner">
                0%
            </div>

            <div class="target-sub" id="target-sub">
                TARGET
            </div>
        </div>

        <div class="progress-bar-bg">
            <div class="progress-bar" id="progress-bar"></div>
        </div>


        <div id="roulette-content">

            <div class="roulette-card">

                <div class="card-grid">

                    <div class="media-col">
                        <img
                            id="level-thumbnail"
                            class="roulette-thumb"
                            src=""
                            alt="Level thumbnail"
                        >
                    </div>


                    <div class="info-col">

                        <div
                            class="level-rank-tag"
                            id="r-rank"
                        >
                            List Rank
                        </div>

                        <div
                            class="level-name"
                            id="r-name"
                        >
                            Loading...
                        </div>


                        <div class="badge-row">

                            <div
                                class="tier-badge"
                                id="r-tier"
                            >
                                -
                            </div>

                            <div
                                class="points-badge"
                                id="r-points"
                            >
                                0 POINTS
                            </div>

                        </div>


                        <div class="details-grid">

                            <div class="detail">
                                <div class="detail-label">
                                    CREATOR
                                </div>

                                <div
                                    class="detail-value"
                                    id="r-creator"
                                >
                                    -
                                </div>
                            </div>


                            <div class="detail">
                                <div class="detail-label">
                                    VERIFIER
                                </div>

                                <div
                                    class="detail-value"
                                    id="r-verifier"
                                >
                                    -
                                </div>
                            </div>

                        </div>


                        <div class="btn-group">

                            <button
                                class="roulette-btn"
                                id="watch-btn"
                            >
                                WATCH
                            </button>

                            <button
                                class="roulette-btn"
                                id="next-btn"
                            >
                                NEXT
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <div
            class="win-screen"
            id="win-screen"
            style="display:none;"
        >
            <div class="progress-banner">
                COMPLETE
            </div>

            <div class="target-sub">
                YOU BEAT THE ROULETTE
            </div>

            <button
                class="roulette-btn"
                id="restart-btn"
            >
                PLAY AGAIN
            </button>
        </div>

    </div>

</div>


<script>

    let allLevels = [];
    let allTiers = [];

    let usedLevelIds = new Set();

    let currentLevel = null;
    let currentStep = 0;

    const totalSteps = 20;


    async function initGame() {

        try {

            const resTiers = await fetch(
                `tiers.json?v=${Date.now()}`
            );

            allTiers = await resTiers.json();


            const resLevels = await fetch(
                `levels.json?v=${Date.now()}`
            );

            allLevels = await resLevels.json();


            /*
             * IMPORTANT:
             *
             * The main list ranks levels by points,
             * highest points first.
             *
             * Roulette must use that exact same ordering
             * when determining the displayed position.
             */
            allLevels.sort(
                (a, b) =>
                    Number(b.points || 0) -
                    Number(a.points || 0)
            );


            setupGame();

            getNewRandomLevel();

        } catch (error) {

            console.error(
                "Error loading roulette:",
                error
            );

        }

    }


    function setupGame() {

        currentStep = 0;
        usedLevelIds.clear();

        updateProgress();

        document
            .getElementById("roulette-content")
            .style.display = "block";

        document
            .getElementById("win-screen")
            .style.display = "none";
    }


    function updateProgress() {

        const percent =
            Math.round(
                (currentStep / totalSteps) * 100
            );

        document
            .getElementById("progress-banner")
            .innerText = `${percent}%`;

        document
            .getElementById("target-sub")
            .innerText =
                `TARGET ${Math.round(
                    ((currentStep + 1) / totalSteps) * 100
                )}%`;

        document
            .getElementById("progress-bar")
            .style.width = `${percent}%`;
    }


    function getNewRandomLevel() {

        if (currentStep >= totalSteps) {

            showWinScreen();

            return;
        }


        /*
         * Find levels that have not already been selected.
         */
        const availableLevels =
            allLevels.filter(level =>
                !usedLevelIds.has(level.id)
            );


        if (availableLevels.length === 0) {

            usedLevelIds.clear();

            return getNewRandomLevel();
        }


        const randomIndex =
            Math.floor(
                Math.random() * availableLevels.length
            );

        currentLevel =
            availableLevels[randomIndex];


        usedLevelIds.add(currentLevel.id);


        displayLevel(currentLevel);

        updateProgress();
    }


    function displayLevel(level) {

        /*
         * Because allLevels has already been sorted by
         * points, this is now the correct list position.
         */
        const listRank =
            allLevels.indexOf(level) + 1;


        document
            .getElementById("r-name")
            .innerText =
                level.name || "Unknown";


        /*
         * Levels ranked beyond 150 are legacy.
         */
        if (listRank > 150) {

            document
                .getElementById("r-rank")
                .innerText = "LEGACY";

        } else {

            document
                .getElementById("r-rank")
                .innerText =
                    `List Rank #${listRank}`;
        }


        document
            .getElementById("r-points")
            .innerText =
                `${Number(level.points || 0)} POINTS`;


        document
            .getElementById("r-creator")
            .innerText =
                level.creator || "-";


        document
            .getElementById("r-verifier")
            .innerText =
                level.verifier || "-";


        /*
         * Find the tier based on the level's points.
         */
        const points =
            Number(level.points || 0);


        let tier = null;

        for (const t of allTiers) {

            const min =
                Number(t.minPoints || 0);

            const max =
                Number(t.maxPoints || Infinity);

            if (
                points >= min &&
                points <= max
            ) {
                tier = t;
                break;
            }
        }


        const tierElement =
            document.getElementById("r-tier");


        if (tier) {

            tierElement.innerText =
                tier.name || "-";

            if (tier.color) {
                tierElement.style.color =
                    tier.color;
            }

        } else {

            tierElement.innerText = "-";
            tierElement.style.color = "";
        }


        const thumbnail =
            document.getElementById(
                "level-thumbnail"
            );


        if (level.thumbnail) {

            thumbnail.src =
                level.thumbnail;

        } else {

            thumbnail.removeAttribute("src");
        }


        /*
         * Watch button
         */
        const watchButton =
            document.getElementById(
                "watch-btn"
            );


        if (level.video) {

            watchButton.style.display =
                "block";

            watchButton.onclick = () => {

                window.open(
                    `https://www.youtube.com/watch?v=${level.video}`,
                    "_blank"
                );

            };

        } else {

            watchButton.style.display =
                "none";
        }

    }


    function nextLevel() {

        currentStep++;

        getNewRandomLevel();
    }


    function showWinScreen() {

        document
            .getElementById("roulette-content")
            .style.display = "none";

        document
            .getElementById("win-screen")
            .style.display = "block";


        document
            .getElementById("progress-banner")
            .innerText = "100%";


        document
            .getElementById("target-sub")
            .innerText =
                "ROULETTE COMPLETE";


        document
            .getElementById("progress-bar")
            .style.width = "100%";
    }


    document
        .getElementById("next-btn")
        .addEventListener(
            "click",
            nextLevel
        );


    document
        .getElementById("restart-btn")
        .addEventListener(
            "click",
            () => {

                setupGame();

                getNewRandomLevel();

            }
        );


    initGame();

</script>

</body>
</html>
