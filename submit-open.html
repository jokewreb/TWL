<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE WAVE LIST - SUBMIT OPEN VERIFICATION</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0b10; color: #fff; font-family: sans-serif; text-align: center; }
        .form-container { max-width: 600px; margin: 60px auto; padding: 40px; background: rgba(20, 22, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
        .form-group { margin-bottom: 25px; text-align: left; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 700; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .form-input { width: 100%; padding: 12px 16px; background: rgba(10, 11, 16, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-size: 0.95rem; box-sizing: border-box; }
        .form-input:focus { outline: none; border-color: #47e5bc; }
        .submit-btn { width: 100%; background: #fff; color: #000; padding: 14px; border: none; border-radius: 6px; font-weight: 700; font-size: 0.95rem; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
        .submit-btn:hover { background: #47e5bc; }
        .red-upload-warning { color: #ff4a4a; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 25px; text-transform: uppercase;">Submit Open Verification</h1>
        <form id="open-submit-form">
            <div class="form-group">
                <label class="form-label" for="lvl-name">Level Name</label>
                <input type="text" id="lvl-name" class="form-input" placeholder="e.g., Corrupted Cavern" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="lvl-creator">Creator</label>
                <input type="text" id="lvl-creator" class="form-input" placeholder="e.g., Karen" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="lvl-diff">Estimated Difficulty</label>
                <input type="text" id="lvl-diff" class="form-input" placeholder="e.g., Top 7 - 4" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="lvl-id">Level ID</label>
                <input type="text" id="lvl-id" class="form-input" placeholder="e.g., 140282256" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="lvl-video">Showcase Link</label>
                <input type="url" id="lvl-video" class="form-input" placeholder="e.g., https://youtube.com/..." required>
            </div>

            <div class="red-upload-warning">
                ⚠️ Upload or copy-paste your thumbnail image directly into the box on the next page!
            </div>

            <button type="submit" class="submit-btn">Continue to GitHub Submission</button>
        </form>
    </div>

    <script>
        const GITHUB_REPO_URL = "https://github.com/jokewreb/TWL";

        document.getElementById('open-submit-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('lvl-name').value.trim();
            const creator = document.getElementById('lvl-creator').value.trim();
            const difficulty = document.getElementById('lvl-diff').value.trim();
            const id = document.getElementById('lvl-id').value.trim();
            const video = document.getElementById('lvl-video').value.trim();

            // Clear, basic text layout parameters that match your submissions logic perfectly
            const issueBody = `NAME: ${name}\n` +
                              `ID: ${id}\n` +
                              `CREATOR: ${creator}\n` +
                              `DIFFICULTY: ${difficulty}\n` +
                              `VIDEO: ${video}\n\n` +
                              `IMAGE OF THUMBNAIL:\n` +
                              `[👉 DRAG AND DROP OR PASTE YOUR THUMBNAIL IMAGE DIRECTLY HERE]`;

            const issueTitle = encodeURIComponent(`Open Verification Request: ${name}`);
            const githubIssuesLink = `${GITHUB_REPO_URL}/issues/new?title=${issueTitle}&body=${encodeURIComponent(issueBody)}`;

            window.open(githubIssuesLink, '_blank');
        });
    </script>
</body>
</html>
